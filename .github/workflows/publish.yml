name: publish

# Слоти задані в київському часі, а cron у GitHub — в UTC, і між EET та EEST
# різниця зʼїжджає на годину. Тому cron беремо з запасом по діапазону, а точне
# вікно перевіряє вже сам publish.py по Europe/Kyiv.
#
# Запас потрібен ще й тому, що scheduled workflow у GitHub регулярно
# запізнюється на 20-60 хвилин.
on:
  schedule:
    - cron: "*/20 5 * * *"
    - cron: "*/20 6-19 * * *"
  workflow_dispatch:

concurrency:
  group: publish
  cancel-in-progress: false     # дві одночасні публікації нам не потрібні

permissions:
  contents: write               # щоб закомітити оновлені статуси черги

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Публікація того, чиє вікно відкрите
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          PYTHONIOENCODING: utf-8
        run: python src/publish.py

      # Черга живе файлом у репозиторії: орг-політика GCP забороняє ключі
      # сервісних акаунтів, тому писати в бакет із Actions не можна.
      # Заразом ці коміти дають репозиторію активність — і GitHub не глушить
      # розклад через 60 днів простою.
      - name: Зберегти статуси черги
        run: |
          if [[ -n "$(git status --porcelain content/manifest.json)" ]]; then
            git config user.name "lisovik-bot"
            git config user.email "bot@users.noreply.github.com"
            git add content/manifest.json
            git commit -m "черга: оновлено статуси публікацій"
            git push
          else
            echo "черга не змінилась"
          fi
