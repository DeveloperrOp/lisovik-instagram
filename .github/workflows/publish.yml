name: publish

on:
  schedule:
    # 03-20 UTC = 06:00-23:00 за Києвом. Було 5-19 UTC, тобто з 08:00,
    # і ранкове вікно 07:00-08:30 у розклад не потрапляло взагалі:
    # перший запуск припадав на 08:00, а GitHub зі своєю затримкою
    # до закриття вікна не встигав. Кожні 15 хвилин замість 20.
    - cron: '*/15 3-20 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Publish due stories
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          PYTHONIOENCODING: utf-8
        run: python src/publish.py

      - name: Commit queue status
        run: |
          git config user.name "lisovik-bot"
          git config user.email "bot@users.noreply.github.com"
          git add content/manifest.json
          git diff --staged --quiet || git commit -m "queue: update publish status"
          git push
