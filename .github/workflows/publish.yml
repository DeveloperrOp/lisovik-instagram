          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          PYTHONIOENCODING: utf-8
        run: |
          git config user.name "lisovik-bot"
          git config user.email "bot@users.noreply.github.com"
          bash .github/publish-loop.sh

  link4:
