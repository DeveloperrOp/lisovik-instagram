name: publish

on:
  schedule:
    - cron: '*/20 5-19 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Publish due stories
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          PYTHONIOENCODING: utf-8
        run: python src/publish.py

      - name: Commit queue status
        run: |
          git config user.name "lisovik-bot"
          git config user.email "bot@users.noreply.github.com"
          git add content/manifest.json
          git diff --staged --quiet || git commit -m "queue: update publish status"
          git push
