# Кадры «зачем мне это», тон — через возражение.
#
# Ярик выбрал этот тон из трёх и добавил правило, которое дороже тона:
# СЛАЙД ЧИТАЮТ В ОТРЫВЕ. У автора контекст есть, у читателя — только
# этот экран. Поэтому кадр, где сказано, что делали, и не сказано, чем
# кончилось, обрывается на полуслове, даже если автору всё понятно.
#
# Отсюда структура: сомнение покупателя → чем дело кончилось → действие.
# Цикл закрыт внутри одного кадра.
#
# Прошлая версия была про МЕТОДИКУ: «шкали давали людям», «міряли час до
# відмови». Читателю не интересно, что учёные заполняли опросник, — ему
# интересно, что из этого вышло.
#
# Числа цифрами, не прописью: «сорока одному» первым делом выдаёт машину.
#
# Границы работ названы прямо в тексте: смесь вместо чистого гриба,
# отсутствие плацебо-группы, крошечная выборка. Это не осторожность,
# а то, что делает кадр интересным — так не пишет никто.

thoughts:
  - key: gives-lionsmane-scales
    day: mon
    topic: Їжовик гребінчастий
    layout: card
    extra: ""
    compound: гериценони
    source: "Mori 2008, HDS-R, 30 японців 50-80, 16 тижнів + замір через 4 тижні"
    claim: "«А що буде, коли перестану пити?»"
    why: >
      У японській роботі перевірили саме це. 30 людей від 50 до 80 приймали
      їжовик 16 тижнів, і бали за тестами росли. Потім гриб забрали — і за
      4 тижні бали сповзли назад.
    do: Не бери банку на один пробний тиждень

  - key: gives-lionsmane-limit
    day: mon
    topic: Їжовик гребінчастий
    layout: card
    extra: ""
    compound: ""
    source: "Docherty 2023, 41 здоровий 18-45, разова доза і 28 днів"
    claim: "«Мені тридцять, мені ж точно піде»"
    why: >
      На здорових молодих це перевіряли окремо: 41 людина від 18 до 45.
      Через годину після дози миттєве відтворення слів вийшло гіршим, ніж
      у групі пустишки. Автори цього не сховали.
    do: Не чекай ефекту з першої ложки

  - key: gives-chaga-limit
    day: tue
    topic: Чага березова
    layout: card
    extra: ""
    compound: ""
    source: "пошук PubMed, серпень 2026: РКД із самою чагою на людях немає"
    claim: "«А дослідження на людях узагалі є?»"
    why: >
      По чазі — майже немає. У PubMed не знайшлося жодної роботи, де людям
      під контролем давали б саму чагу. Усе, що є, зроблено на мишах і на
      клітинах у чашці.
    do: Бери чагу як напій, а не як дослідження

  - key: gives-cordyceps-vo2
    day: wed
    topic: Кордицепс військовий
    layout: card
    extra: ""
    compound: кордицепін
    source: "Hirsch 2017, VO2max і час до відмови, 28 активних, 1 і 3 тижні"
    claim: "«Тиждень попив — нічого не змінилось»"
    why: >
      Так і було. У роботі на 28 активних людях за перший тиждень групи з
      грибом і з пустишкою не розійшлися. Через три тижні — розійшлися.
      Але давали суміш грибів, а не чистий кордицепс.
    do: Постав банку поруч із кавою на три тижні

  - key: gives-cordyceps-older
    day: wed
    topic: Кордицепс військовий
    layout: card
    extra: ""
    compound: кордицепін
    source: "Chen 2010, метаболічний поріг, 20 людей 50-75, 12 тижнів"
    claim: "«Після пʼятдесяти це вже марно»"
    why: >
      Саме цю групу й перевіряли: 20 людей від 50 до 75, 12 тижнів на
      велотренажері. Поріг, за яким у крові накопичується кислота, у групах
      виглядав по-різному. А максимальне споживання кисню не зрушилось.
    do: Порахуй, на яке число випаде дванадцятий тиждень

  - key: gives-ashwa-stress
    day: thu
    topic: Ашваганда
    layout: card
    extra: ""
    compound: вітаноліди
    source: "Lopresti 2019 (HAM-A, DASS-21) + зведення 488 учасників по кортизолу"
    claim: "«Це ж просто анкети, а не аналізи»"
    why: >
      Тому брали і те, і те. За анкетою HAM-A різниця з пустишкою вийшла
      значущою, за DASS-21 — не дотягнула. А кортизол у крові у зведенні
      488 учасників пішов униз.
    do: Здай кортизол до старту, щоб було з чим порівняти

  - key: gives-ashwa-sleep
    day: thu
    topic: Ашваганда
    layout: card
    extra: ""
    compound: вітаноліди
    source: "Langade 2020, актиграфія, 60 пацієнтів, 10 тижнів"
    claim: "«Сон — річ суб’єктивна»"
    why: >
      Тому міряли приладом на зап’ясті, а не опитуванням: скільки хвилин до
      засинання і скільки разів прокидаєшся. Цифри між групами розійшлися.
      Але брали людей зі скаргами на сон, не здорових.
    do: Поклади банку біля ліжка, щоб не забувати ввечері

  - key: gives-reishi-fatigue
    day: fri
    topic: Рейші
    layout: card
    extra: ""
    compound: бета-глюкани
    source: "Tang 2005, шкала втоми, 132 дорослих, 8 тижнів"
    claim: "«Різниця там, певно, мізерна»"
    why: >
      Майже так і є. Показник втоми зсунувся приблизно на чверть у групі
      рейші й на пʼяту частину в групі пустишки. Рух був в обох, різниця
      невелика — але вона є і її порахували.
    do: Заповни ту саму шкалу на старті й через місяць

  - key: gives-spirulina-memory
    day: sat
    topic: Спіруліна
    layout: card
    extra: ""
    compound: фікоціанін
    source: "Spirulina maxima extract, 80 літніх із легким зниженням, 12 тижнів"
    claim: "«Це для літніх, мені ще рано»"
    why: >
      Схоже на те. 80 добровольців старшого віку з легким зниженням 12 тижнів
      проходили тести на зорову памʼять, і результати між групами розійшлися.
      Але брали спиртовий екстракт, а не порошок.
    do: Не переноси ці цифри на себе, якщо тобі тридцять

  - key: gives-spirulina-run
    day: sat
    topic: Спіруліна
    layout: card
    extra: ""
    compound: фікоціанін
    source: "Kalafati 2010, час до відмови в бігу, 9 тренованих, перехресний"
    claim: "«Девʼять людей — це не дослідження»"
    why: >
      Вибірка мала, так. Але кожен із девʼятьох пройшов і спіруліну, і
      пустишку, тобто був сам собі контролем. Час до відмови в бігу між
      двома заходами розійшовся.
    do: Признач день, коли повториш ту саму дистанцію

  - key: gives-chlorella-b12
    day: sat
    topic: Хлорела
    layout: card
    extra: ""
    compound: хлорофіл
    source: "Merchant 2015, метилмалонова кислота, 17 веганів, 60 днів"
    claim: "«Як перевірити, що воно засвоїлось?»"
    why: >
      У роботі на 17 веганах брали кров на метилмалонову кислоту: вона
      росте, коли B12 бракує. За два місяці цифра пішла вниз. Групи пустишки
      там не було, і це теж треба знати.
    do: Здай аналіз до старту, а не після нього

  - key: gives-duration
    day: sun
    topic: Ритм прийому
    layout: card
    extra: ""
    compound: ""
    source: "зведення 488 учасників; Mori 2008 — перший замір на 16-му тижні"
    claim: "«Скільки чекати, щоб зрозуміти?»"
    why: >
      Коротше чотирьох тижнів ніхто й не міряв: у зведенні 488 учасників
      курси починались від чотирьох. А в японській роботі по їжовику перший
      контрольний замір стояв аж на 16-му тижні.
    do: Постав нагадування на четвертий тиждень
