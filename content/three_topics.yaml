thoughts:
- key: shiitake-umami
  topic: Шиїтаке
  layout: card
  extra: ''
  compound: 5'-гуанілат
  source: Kurihara K. Umami the Fifth Basic Taste. BioMed Res Int 2015, PMID 26247011
  claim: «Навіщо гриб, якщо я не вірю в добавки?»
  why: Тоді бери його як приправу. Два сушені капелюшки в каструлі роблять бульйон помітно наваристішим,
    хоча більше ти нічого туди не поклав. За це відповідає речовина з гриба, яку звуть гуанілатом.
  do: Кинь два капелюшки в наступний бульйон
- key: ginseng-red-white
  topic: Женьшень
  layout: versus
  extra: 'Білий: 25 гінзенозидів|Червоний: 29, і вшестеро більше рідкісних'
  compound: гінзенозиди
  source: порівняльний аналіз коренів Panax ginseng, білий проти червоного
  claim: «Червоний дорожчий — це не просто назва?»
  why: 'Корінь той самий, різниця в обробці. У білому знайшли 25 діючих сполук, у червоному 29, а сумарно
    їх приблизно в 1,8 раза більше. Шість із них є тільки в червоному: вони утворюються під час пропарювання.

    '
  do: Порівняй склад на двох банках перед вибором
- key: combo-surgery
  topic: Поєднання з ліками
  layout: card
  extra: ''
  compound: ''
  source: 'клінічний випадок: грибна кава 2 місяці до операції, кровотеча анастомозу'
  claim: «Та що там може бути, це ж просто гриби»
  why: 'Здебільшого нічого. Але описаний випадок є: людина два місяці пила грибну каву перед операцією,
    і потім була кровотеча. Скасувала — далі все пройшло спокійно. Один випадок, а не правило.'
  do: Скажи хірургу про добавки до операції, а не після
