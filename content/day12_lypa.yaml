    softbox, a man in an 18th-century coat and wig holding a small open
    blank notebook, a director pointing.
  claim: Лінней узяв прізвище від липи
  why: >
    Батько Карла Ліннея мав обрати прізвище, вступаючи до університету. Біля
    родинної садиби росла величезна липа — шведською lind, — і він назвався
    Linnæus. Так найвідоміший ботанік отримав прізвище від дерева.
  source: en.wikipedia Carl Linnaeus
