thoughts:
- key: w12-sonne-dawn
  topic: Чай «Сонне зілля»
  day: sun
  slot: dawn
  layout: specimen
  subject: >
    On a low white round pedestal in the middle of the frame lies a small
    heap of fresh chamomile flowers (white petals, yellow centres) next to
    one small green apple.
  crew: >
    Five tiny people: a photographer with a camera on a tripod, an
    assistant holding a round white reflector, a lighting tech next to a
    softbox, a stylist sniffing one chamomile flower, a director pointing.
  claim: Ромашка — «земне яблуко»
  why: >
    Назва ромашки в багатьох мовах — від грецького chamaimēlon: «на землі» й
    «яблуко». Квітка низенька, а пахне яблуком.
  source: en.wikipedia Matricaria chamomilla (etymology)
