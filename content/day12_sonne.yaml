  claim: 'Ягода ялівцю — насправді шишка'
  why: >
    Ялівець — хвойна рослина, як сосна. Його синя кулька — це луски, що стали
    мʼясистими й зрослися. Дозріває вона довго: від пів року до півтора.
  source: en.wikipedia Juniper
