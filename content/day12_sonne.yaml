# Тиждень 12, день 6: Чай «Сонне зілля», 40 г — сім трав. Подача «фотостудія» (v10).
# product: https://lisovik.com.ua/chai-sonne-zillia-40-h/
# Факти — дослідник 09.11, по одній рослині на кадр. Жодного слова про сон
# чи заспокоєння: лише ботаніка й назви. Німфу Мінту й «радість гір» не
# беремо (не підтверджено).
