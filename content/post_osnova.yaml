caption: |
  Щоденна основа: омега-3 і магній гліцинат на місяць

  Дві добавки, з яких починають, коли досі не пив нічого. Не екзотика,
  а те, чого найчастіше бракує у звичайному раціоні: жирна морська риба
  на столі буває рідко, а магній витрачається швидше, ніж здається.

  Що в наборі:
  • Омега-3 риб'ячий жир — EPA 368 мг + DHA 248 мг
  • Магній гліцинат — 208 мг магнію, це 55% добової норми

  Як приймати: чотири капсули на день, по дві з кожної банки, за їжею.
  У кожній банці 60 капсул, тож обидві закінчаться рівно через місяць —
  наступний набір береш одразу, без перерви.

  1030 грн за обидві банки. Посилання на курс — у шапці профілю.
  Питання і замовлення — пиши в директ.

  Дієтична добавка. Не замінює повноцінний раціон харчування. Не є
  лікарським засобом. Не рекомендовано дітям до 18 років, вагітним
  і жінкам у період лактації.


