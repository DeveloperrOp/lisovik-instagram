# День ашваганди. Собран по брифу продукта: возражения из voice_lines,
# формы в наличии из каталога, факты о самом предмете.
#
# 🚨 Формулировки пользы с карточки НЕ БЕРУТСЯ. В описаниях стоят
# «протипухлинні властивості», «знімає болі» і «стабілізує тиск».
# В Instagram это блокировка, по закону о добавках — нарушение.
#
# Поэтому польза здесь — со стороны предмета: вкус, цвет, форма, время
# приёма. Это правда, и она ничего не лечит.

