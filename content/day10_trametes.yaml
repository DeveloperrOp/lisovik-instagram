thoughts:
- key: w10-trametes-dawn
  topic: Траметес різнобарвний
  day: sun
  slot: dawn
  layout: specimen
  subject: >
    a dry twig with many thin fan-shaped turkey tail mushrooms (Trametes
    versicolor) overlapping in rows, each with concentric bands from grey-blue
    and black to rust and ochre and a pale edge, fixed to the paper with thin
    strips of paper tape, a small blank cream tag tied with twine beside it.
  claim: Лінней назвав його «різнобарвним»
  why: 1753 року він описав гриб як Boletus versicolor. Кільця на шапках ідуть від сіро-блакитного й чорного
    до рудого й охристого.
  source: 'en.wikipedia Trametes versicolor; NZOR (Sp. Pl. 2: 1176)'
- key: w10-trametes-morning
  topic: Траметес різнобарвний
  day: sun
  slot: morning
  layout: jar
  subject: >
    a dry twig with overlapping thin fan-shaped turkey tail mushrooms with
    concentric colour bands, fixed with thin strips of paper tape, and the
    product lying on the paper in the lower right.
  claim: Японці бачать у ньому черепицю
  why: Каваратаке означає «гриб-черепиця» — десятки шапок лягають одна на одну, як черепиця на даху.
  source: ja.wikipedia カワラタケ; kotobank.jp (Всесвітня енциклопедія Хейбонся)
- key: w10-trametes-noon
  topic: Траметес різнобарвний
  day: sun
  slot: noon
  layout: specimen
  subject: >
    three single turkey tail caps laid in a neat row showing concentric
    colour bands, one of them turned over to show the fine white pores
    underneath, each fixed with a strip of paper tape.
  claim: Хмара, черепиця чи хвіст індика
  why: Японці звуть його ще кумотаке — «хмарний гриб». В Америці — індичим хвостом, а британці колись казали
    «багатозонний трутовик».
  source: kotobank.jp (Britannica Japan, 雲茸); first-nature.com/fungi/trametes-versicolor.php
- key: w10-trametes-evening
  topic: Траметес різнобарвний
  day: sun
  slot: evening
  layout: specimen
  subject: >
    a small piece of dry grey bark covered with rows of overlapping thin
    turkey tail fans with concentric colour bands, fixed with paper tape.
  claim: Його знаходили навіть на 2560 метрах
  why: Траметес — один із найзвичайніших грибів на мертвій деревині. Європа, Азія, Африка, обидві Америки й
    Австралазія, а найвище — у горах Колумбії.
  source: colfungi.org (Index Fungorum 281625); kotobank.jp
- key: w10-trametes-sell
  topic: Траметес різнобарвний
  day: sun
  slot: sell
  layout: sell
  subject: >
    a dry twig with overlapping turkey tail fans fixed with paper tape on the
