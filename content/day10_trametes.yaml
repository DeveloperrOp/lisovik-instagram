# Тиждень 10, день 6: Траметес різнобарвний, екстракт 10:1 у капсулах. Вайб «гербарій на шалфеї».
# product: https://lisovik.com.ua/trametes-riznobarvnyi-ekstrakt-101-kapsuly-120-sht-po-0.5-h/
# Факти — дослідник 25.10, кожен із джерелом. 🚨 Ні PSK/Krestin, ні PSP, ні
# онкології: бан BM. Раніше виходило «каваратаке — з берега річки» — це
# помилка перекладу, правильно «гриб-черепиця»; тут подаємо правильно.
# Ціна — за банку на 120, як на фото.
product:
  name: Траметес різнобарвний
  plaque: Гриб-черепиця
  latin: Trametes versicolor
  price: 950
  ref: w10_jar_trametes_LIS-481502.jpg
  pack: >
    an opaque WHITE plastic bottle with a white snap cap and a grey-brown
    label with the white ЛІСОВИК tree-face logo, mushroom pictures on the side
