  claim: Риб'ячий жир у капсулі
  why: У банці 60 капсул. EPA і DHA на етикетці пораховані окремо від ваги олії.
  do: Обери банку на 60 чи на 100 капсул
  source: "склад у каталозі LIS-N452051: риб'ячий жир, EPA, DHA"
