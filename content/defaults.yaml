# Спільні налаштування. Правляться тут, а не в згенерованому плані.

cta: "Замовити → посилання в шапці профілю"

disclaimer: "Дієтична добавка. Не замінює повноцінний раціон харчування. Не є лікарським засобом."

# Обов'язковий негатив для КОЖНОЇ генерації.
# Мухомор моделі домальовують самі — це дефолтний образ «лісового гриба».
negative: >-
  no red-and-white spotted mushrooms, no Amanita muscaria, no fly agaric,
  no people, no faces, no hands,
  no medical imagery, no pills, no blister packs, no pharmacy shelves,
  no dosage numbers, no watermarks,
  no text on packaging, no product labels with readable words,
  no invented brand names, no real-world brands or logos of any company,
  no lorem ipsum, no placeholder text, no captions, no signage,
  no text panels or boxes behind the headline

style: >-
  premium editorial photography, Ukrainian forest mood, deep green and warm
  cream palette, soft natural light, shallow depth of field, no clutter

# Вікна публікації замість жорсткої хвилини:
# світло вимикають, тривоги, плюс GitHub Actions cron сам по собі неточний.
# Час початку кожного вікна назвав власник 29.08.2026:
# 7:00, 10:00, 12:00, 18:00, 20:00. Кінець вікна — запас на затримку.
slots:
  dawn: ["07:00", "09:45"]
  morning: ["10:00", "11:45"]
  noon: ["12:00", "17:45"]
  evening: ["18:00", "18:55"]
  sell: ["19:00", "19:55"]
  night: ["20:00", "22:30"]

# КОЖЕН ДЕНЬ — ПРО ОДИН ПРОДУКТ.
# Чотири сторіс дня працюють на нього: спершу пояснюємо, потім показуємо як
# вживати, ввечері — сам товар, вночі — помилка, порівняння чи відгук.
# Інакше виходить, що зранку розповідаємо про їжовик, а ввечері продаємо чагу.
day_themes:
  mon:
    name: "Їжовик"
    keys: [їжовик]
    categories: [Їжовик]
  tue:
    name: "Чага"
    keys: [чаг]
    categories: [Чага]
  wed:
    name: "Спіруліна"
    keys: [спіруліна]
    categories: [Спіруліна]
    # по тижнях чергується з хлорелою — один день, один продукт
    rotate:
      - {name: "Спіруліна", keys: [спіруліна], categories: [Спіруліна]}
      - {name: "Хлорела",   keys: [хлорел],    categories: [Хлорела]}
  thu:
    name: "Кордицепс"
    keys: [кордицепс]
    categories: [Кордицепс]
  fri:
    name: "Ашваганда"
    keys: [ашваганд]
    categories: [Ашваганда]
    # «Адаптогени» як група давали ту саму проблему, що «Кулінарні»:
    # теми про ашваганду, а товар міг бути женьшенем
    rotate:
      - {name: "Ашваганда", keys: [ашваганд],           categories: [Ашваганда]}
      - {name: "Женьшень",  keys: [женьшень, родіол],   categories: [Женьшень]}
  sat:
    name: "Рейші"
    keys: [рейші]
    categories: [Рейші]
    # день-збірник не працює: теми виходили про рейші, а товар — лисички.
    # Тому теж чергуємо по одному продукту на тиждень.
    rotate:
      - {name: "Рейші",   keys: [рейші],            categories: [Рейші]}
      - {name: "Шиїтаке", keys: [шиітаке, шиїтаке], categories: [Шиїтаке]}
      - {name: "Майтаке", keys: [майтаке],          categories: [Майтаке]}
      - {name: "Лисички", keys: [лисичк],           categories: [Лисичк]}
  sun:
    name: "Чай"
    keys: [чай, збір, трав]
    categories: [Чай]
    # день-збірник теж не працює: теми були загальні, а товар брався навмання
    rotate:
      - {name: "Чай",     keys: [чай, збір, трав], categories: [Чай]}
      - {name: "Тремела", keys: [тремел],          categories: [Тремела]}

# Порядок типів у дні. Ніч чергується по днях, щоб не було одноманітно.
# Пʼятий слот — оферта: асортимент, директ, сайт. День без неї вів до
# продукту й не казав, куди йти замовляти.
day_slots: [useful, howto, product, night, sell, offer]
night_rotation:
  mon: ask
  tue: mistake
  wed: compare
  thu: myth
  fri: ask
  sat: mistake
  sun: compare

# За тиждень: product 7, useful 7, howto 7, ask 2, mistake 2, compare 2, review 1

# Типи, які завжди публікуються руками (потрібен стікер)
# Стікерів через API немає, тому «питання» йдуть автоматом
# із прямим призивом писати в директ
manual_types: []

# Reels тягнуть нову аудиторію, Stories працюють лише на наявних підписників
reels_days: [mon, wed, fri]
feed_days: [tue, thu, sat]

# Заголовок-користь для товарних сторіс: категорія → обіцянка.
