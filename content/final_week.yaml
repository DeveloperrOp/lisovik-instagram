thoughts:
- key: gives-lionsmane-scales
  day: mon
  topic: Їжовик гребінчастий
  layout: card
  extra: ''
  compound: гериценони
  source: Mori 2008, HDS-R, 30 японців 50-80, 16 тижнів + замір через 4 тижні
  claim: «А що буде, коли перестану пити?»
  why: 'У японській роботі перевірили саме це. 30 людей від 50 до 80 приймали їжовик 16 тижнів, і бали
    за тестами росли. Потім гриб забрали — і за 4 тижні бали сповзли назад.

    '
  do: Не бери банку на один пробний тиждень
- key: gives-lionsmane-limit
  day: mon
  topic: Їжовик гребінчастий
  layout: card
  extra: ''
  compound: ''
  source: Docherty 2023, 41 здоровий 18-45, разова доза і 28 днів
  claim: «Мені тридцять, мені ж точно піде»
  why: 'На здорових молодих це перевіряли окремо: 41 людина від 18 до 45. Через годину після дози миттєве
    відтворення слів вийшло гіршим, ніж у групі пустишки. Автори цього не сховали.

    '
  do: Не чекай ефекту з першої ложки
- key: lm-body-vs-grain
  claim: Грибниця на зерні — це переважно зерно
  why: Біле голчасте тіло росте на стовбурі. Речовини з нього звуть гериценонами, у грибниці вони інші
    — еринацини.
  do: 'Перевір у складі: плодові тіла чи зерно'
  layout: versus
  extra: 'Плодове тіло: гериценони|Зерно з грибницею: еринацини'
  compound: гериценони, еринацини
  day: mon
  topic: 'Їжовик гребінчастий: гриб, його речовини і перші дні'
- key: lm-extract
  claim: Екстракт — той самий гриб, тільки густіший
  why: 'Сировину виварюють і сушать: з десяти ложок виходить одна. Речовини, заради яких гриб і беруть,
    звуть гериценонами.'
  do: Знайди на банці 10:1 — десять ложок в одній мірці
  layout: stat
  extra: '10:1'
  compound: гериценони
  day: mon
  topic: 'Їжовик гребінчастий: гриб, його речовини і перші дні'
- key: gives-chaga-limit
  day: tue
  topic: Чага березова
  layout: card
  extra: ''
  compound: ''
  source: 'пошук PubMed, серпень 2026: РКД із самою чагою на людях немає'
  claim: «А дослідження на людях узагалі є?»
  why: 'По чазі — майже немає. У PubMed не знайшлося жодної роботи, де людям під контролем давали б саму
    чагу. Усе, що є, зроблено на мишах і на клітинах у чашці.

    '
  do: Бери чагу як напій, а не як дослідження
- key: chaga-melanin-color
  claim: Чашка темніє не від бруду, а від пігменту
  why: Чорна кірка роками накопичує темні барвники, їх звуть меланінами. У чашці саме вони дають колір
    міцного чаю.
  do: 'Перевір колір на просвіт: має бути як міцний чай'
  layout: title_sub
  extra: колір міцного чаю, а не каламуть
  compound: меланіни
  day: tue
  topic: 'Чага березова: колір, дерево і вода'
- key: chaga-birch-betulinic
  claim: Береза вирішує, а не сам наріст
  why: Гриб роками тягне сік живої берези. Разом із соком у нього заходить смолиста речовина кори, її
    звуть бетуліновою кислотою.
  do: Знайди в назві слово «березова», а не просто «чага»
  layout: versus
  extra: береза / будь-яке інше дерево
  compound: бетулінова кислота
  day: tue
  topic: 'Чага березова: колір, дерево і вода'
- key: chaga-not-boiling
  claim: Гірко виходить від окропу, не від гриба
  why: Довге кипіння витягує з кірки різкість, і смак стає як у перепаленого чаю. Вода біля 80 градусів
    дає колір без гіркоти.
  do: Дай окропу постояти пʼять хвилин, тоді залий
  layout: steps
  extra: окріп → 5 хвилин → залив
  compound: —
  day: tue
  topic: 'Чага березова: колір, дерево і вода'
- key: gives-cordyceps-vo2
  day: wed
  topic: Кордицепс військовий
  layout: card
  extra: ''
  compound: кордицепін
  source: Hirsch 2017, VO2max і час до відмови, 28 активних, 1 і 3 тижні
  claim: «Тиждень попив — нічого не змінилось»
  why: 'Так і було. У роботі на 28 активних людях за перший тиждень групи з грибом і з пустишкою не розійшлися.
    Через три тижні — розійшлися. Але давали суміш грибів, а не чистий кордицепс.

    '
  do: Постав банку поруч із кавою на три тижні
- key: gives-cordyceps-older
  day: wed
  topic: Кордицепс військовий
  layout: card
  extra: ''
  compound: кордицепін
  source: Chen 2010, метаболічний поріг, 20 людей 50-75, 12 тижнів
  claim: «Після пʼятдесяти це вже марно»
  why: 'Саме цю групу й перевіряли: 20 людей від 50 до 75, 12 тижнів на велотренажері. Поріг, за яким
    у крові накопичується кислота, у групах виглядав по-різному. А максимальне споживання кисню не зрушилось.

    '
  do: Порахуй, на яке число випаде дванадцятий тиждень
- key: cordyceps-what-inside
  claim: У грибі сидить двійник речовини з тіла
  why: У кожній клітині є шматочок, який звуть аденозином. У грибі лежить майже такий самий, тільки без
    кисню — кордицепін.
  do: 'Перевір склад: кордицепс військовий, плодові тіла'
  layout: versus
  extra: аденозин / кордицепін
  compound: кордицепін, аденозин
  day: wed
  topic: 'Кордицепс військовий: що всередині і як пити'
- key: cordyceps-orange
  claim: Порошок у ложці має бути помаранчевим
  why: Свіжий гриб росте яскраво-оранжевим. Такий самий колір має морква, і дають його ті самі барвники
    — їх звуть каротиноїдами.
  do: Насип ложку на біле блюдце і подивись на колір
  layout: card
  extra: морква і кордицепс — один колір
  compound: каротиноїди
  day: wed
  topic: 'Кордицепс військовий: що всередині і як пити'
- key: gives-ashwa-stress
  day: thu
  topic: Ашваганда
  layout: card
  extra: ''
  compound: вітаноліди
  source: Lopresti 2019 (HAM-A, DASS-21) + зведення 488 учасників по кортизолу
  claim: «Це ж просто анкети, а не аналізи»
  why: 'Тому брали і те, і те. За анкетою HAM-A різниця з пустишкою вийшла значущою, за DASS-21 — не дотягнула.
    А кортизол у крові у зведенні 488 учасників пішов униз.

    '
  do: Здай кортизол до старту, щоб було з чим порівняти
- key: gives-ashwa-sleep
  day: thu
  topic: Ашваганда
  layout: card
  extra: ''
  compound: вітаноліди
  source: Langade 2020, актиграфія, 60 пацієнтів, 10 тижнів
  claim: «Сон — річ суб’єктивна»
  why: 'Тому міряли приладом на зап’ясті, а не опитуванням: скільки хвилин до засинання і скільки разів
    прокидаєшся. Цифри між групами розійшлися. Але брали людей зі скаргами на сон, не здорових.

    '
  do: Поклади банку біля ліжка, щоб не забувати ввечері
- key: ashwa-root-not-berry
  claim: Ашваганда — це корінь, а не ягода
  why: 'Кущ родич фізалісу, з такими самими ліхтариками на гілках. Копають саме корінь: у ньому сидять
    гіркі речовини, їх звуть вітанолідами.'
  do: 'Подивись у складі: корінь, а не плоди чи листя'
  layout: card
  extra: ліхтарик на гілці / корінь у землі
  compound: вітаноліди
  day: thu
  topic: 'Ашваганда: корінь, запах і строки'
- key: ashwa-leaf-vs-root
  claim: У листі й корені різні речовини
  why: Найрізкіша сполука сидить не в корені, а в листі. Ту сполуку з листя звуть вітаферином А, у корені
    її мало.
  do: Читай склад до першої порції, а не після неї
  layout: versus
  extra: лист — вітаферин А / корінь — вітаноліди
  compound: вітаферин А
  day: thu
  topic: 'Ашваганда: корінь, запах і строки'
- key: gives-reishi-fatigue
  day: fri
  topic: Рейші
  layout: card
  extra: ''
  compound: бета-глюкани
  source: Tang 2005, шкала втоми, 132 дорослих, 8 тижнів
  claim: «Різниця там, певно, мізерна»
  why: 'Майже так і є. Показник втоми зсунувся приблизно на чверть у групі рейші й на пʼяту частину в
    групі пустишки. Рух був в обох, різниця невелика — але вона є і її порахували.

    '
  do: Заповни ту саму шкалу на старті й через місяць
- key: reishi-bitter-proof
  claim: Гіркота на язиці — знак, що речовини на місці
  why: Гіркоту дає група смолистих речовин, їх звуть ганодеровими кислотами. У печериці таких немає, тому
    вона смакує як звичайна їжа.
  do: Візьми дрібку на язик — гіркота чується одразу
  layout: versus
  extra: печериця — мʼяка / рейші — гірка
  compound: ганодерові кислоти
  day: fri
  topic: 'Рейші: гіркота, відвар і друга варка'
- key: reishi-two-groups
  claim: Гіркота і густина відвару — це різні речовини
  why: Одні гіркі та смолисті, їх звуть ганодеровими кислотами. Другі — довгі цукри зі стінок гриба, вони
    звуться бета-глюканами.
  do: 'Спробуй відвар на смак: гірко — кислоти, густо — цукри'
  layout: versus
  extra: Гіркі смолисті — ганодерові кислоти|Довгі цукри зі стінок — бета-глюкани
  compound: ганодерові кислоти, бета-глюкани
  day: fri
  topic: 'Рейші: гіркота, відвар і друга варка'
- key: reishi-slow-simmer
  claim: Рейші не заварюють, як чай у чашці
  why: Стінки клітин щільні, і вода тягне з них довгі цукри поволі. Ці цукри звуть бета-глюканами, за
    пʼять хвилин вони не виходять.
  do: Постав ківш на малий вогонь і томи пів години
  layout: steps
  extra: Залий шматок холодною водою|Доведи до слабкого кипіння|Томи пів години під кришкою
  compound: бета-глюкани
  day: fri
  topic: 'Рейші: гіркота, відвар і друга варка'
- key: gives-spirulina-memory
  day: sat
  topic: Спіруліна
  layout: card
  extra: ''
  compound: фікоціанін
  source: Spirulina maxima extract, 80 літніх із легким зниженням, 12 тижнів
  claim: «Це для літніх, мені ще рано»
  why: 'Схоже на те. 80 добровольців старшого віку з легким зниженням 12 тижнів проходили тести на зорову
    памʼять, і результати між групами розійшлися. Але брали спиртовий екстракт, а не порошок.

    '
  do: Не переноси ці цифри на себе, якщо тобі тридцять
- key: gives-chlorella-b12
  day: sat
  topic: Хлорела
  layout: card
  extra: ''
  compound: хлорофіл
  source: Merchant 2015, метилмалонова кислота, 17 веганів, 60 днів
  claim: «Як перевірити, що воно засвоїлось?»
  why: 'У роботі на 17 веганах брали кров на метилмалонову кислоту: вона росте, коли B12 бракує. За два
    місяці цифра пішла вниз. Групи пустишки там не було, і це теж треба знати.

    '
  do: Здай аналіз до старту, а не після нього
- key: gives-spirulina-run
  day: sat
  topic: Спіруліна
  layout: card
  extra: ''
  compound: фікоціанін
  source: Kalafati 2010, час до відмови в бігу, 9 тренованих, перехресний
  claim: «Девʼять людей — це не дослідження»
  why: 'Вибірка мала, так. Але кожен із девʼятьох пройшов і спіруліну, і пустишку, тобто був сам собі
    контролем. Час до відмови в бігу між двома заходами розійшовся.

    '
  do: Признач день, коли повториш ту саму дистанцію
- key: spirulina-vs-chlorella
  claim: У хлорели тверда стінка, у спіруліни її немає
  why: Спіруліна — це бактерія, її вміст доступний одразу. Хлорела — водорість, і целюлозу навколо клітини
    заводу доводиться руйнувати.
  do: 'Почни з чогось одного: спіруліна зранку, хлорела потім'
  layout: versus
  extra: спіруліна — бактерія / хлорела — водорість
  compound: фікоціанін, клітковина
  day: sat
  topic: 'Спіруліна і хлорела: колір, смак, різниця'
- key: gives-duration
  day: sun
  topic: Ритм прийому
  layout: card
  extra: ''
  compound: ''
  source: зведення 488 учасників; Mori 2008 — перший замір на 16-му тижні
  claim: «Скільки чекати, щоб зрозуміти?»
  why: 'Коротше чотирьох тижнів ніхто й не міряв: у зведенні 488 учасників курси починались від чотирьох.
    А в японській роботі по їжовику перший контрольний замір стояв аж на 16-му тижні.

    '
  do: Постав нагадування на четвертий тиждень
- key: mark-before-start
  claim: Без мітки на старті нема з чим порівняти
  why: Настрій стрибає щодня від сну і новин, за ним нічого не видно. Пульс зранку чи година засинання
    — це те, що можна порівняти.
  do: 'Запиши сьогодні одну річ: пульс одразу після сну'
  layout: steps
  extra: 'Обери одну річ: пульс або сон|Запиши її сьогодні одним рядком|Постав дату через чотири тижні'
  compound: —
  day: sun
  topic: Як приймати і як міряти
- key: pause-shows
  claim: Тиждень без ложки — друга точка порівняння
  why: Один день ні з чим порівняти. Довгі цукри зі стінок гриба, їх звуть бета-глюканами, у тілі не накопичуються.
  do: Признач сьогодні день, коли зробиш тижневу перерву
  layout: versus
  extra: тиждень із ложкою / тиждень без
  compound: бета-глюкани
  day: sun
  topic: Як приймати і як міряти
- key: shelf-light
  claim: Сонце на підвіконні гасить колір порошку
  why: Помаранчевий колір кордицепсу дають барвники, які звуть каротиноїдами. На прямому світлі вони бліднуть,
    як фарба на вивісці.
  do: Перестав банку з підвіконня у кухонну шафу
  layout: callout
  extra: підвіконня → шафа
  compound: каротиноїди
  day: sun
  topic: Як приймати і як міряти
