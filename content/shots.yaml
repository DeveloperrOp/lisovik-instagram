  - key: chaga-in-palm
    hero: nature
    about: "Щойно відламаний шматок чаги у мокрій долоні — злам видно просто в лісі. Кадр самодостатній без тексту."
    text: none
    hands: false
    moment: >
      a freshly broken piece of chaga lying on a flat wet stone in the forest,
