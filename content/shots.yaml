    life: >
      old knife scars in the wood

  - key: product-jar-scoop
    hero: product
    about: "Продукт крупно: відкрита банка порошку і мірна ложка з гіркою в сірому денному світлі. Кадр самодостатній без тексту."
    text: none
    hands: false
    moment: >
      an open glass jar of cream-coloured mushroom powder stands on a clean
      pale worktop, a measuring scoop resting in the powder heaped over its
