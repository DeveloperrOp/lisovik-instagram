  source: IPNI 55479-2; en.wikipedia Chamaenerion angustifolium
- key: w11-ivan-morning
  topic: Іван-чай
  day: thu
  slot: morning
  layout: jar
  subject: >
    a giant pressed fireweed stem with pink-purple flowers fixed with strips
