thoughts:
- key: clean-body-vs-mycelium
  topic: Їжовик гребінчастий
  layout: versus
  extra: 'Плодове тіло: гериценони|Міцелій на зерні: еринацини'
  compound: гериценони, еринацини
  source: хімія плодових тіл проти культивованого міцелію
  claim: «Плодове тіло чи міцелій — є різниця?»
  why: Є, і вона в самих речовинах. У мʼякоті гриба сидить одна група сполук, їх звуть гериценонами. Друга
    група живе в міцелії на зерні і зветься еринацинами. Набори різні, а не більше й менше того самого.
  do: 'Читай склад: там прямо написано, що всередині'
- key: clean-chaga-colour
  topic: Чага березова
  layout: card
  extra: ''
  compound: меланіни
  source: меланіни кірки чаги як джерело кольору настою
  claim: «Чому настій такий темний?»
  why: 'Чорна кірка чаги роками накопичує темні барвники, які звуть меланінами. Саме вони фарбують воду
    в колір міцного чаю. Чим довше гриб ріс на березі, тим глибший відтінок дає той самий шматок.

    '
  do: Дивись на просвіт — настій має бути прозорим
- key: clean-cordyceps-colour
  topic: Кордицепс військовий
  layout: card
  extra: ''
  compound: каротиноїди
  source: каротиноїди як джерело помаранчевого кольору Cordyceps militaris
  claim: «Чому порошок такий помаранчевий?»
  why: 'Колір дає група барвників, яку звуть каротиноїдами — та сама, що робить помаранчевою моркву. Живий
    кордицепс росте яскраво-рудим, і в помелі відтінок лишається таким самим.

    '
  do: Насип ложку на біле блюдце і глянь на колір
