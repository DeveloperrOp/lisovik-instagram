  topic: Шиїтаке
  day: tue
  slot: morning
  layout: jar
  subject: >
    The product stands on a low white round pedestal in the middle of the
    frame, two dried shiitake caps (brown with pale cracks) lie on the floor
    beside it.
  crew: >
    Five tiny people: a photographer kneeling with a camera, an assistant
    with a reflector, a man reading a big open blank book while sitting on
