  slot: noon
  layout: specimen
  subject: >
    On a low white round pedestal in the middle of the frame lies one
    closed old blank book with a plain brown cover and, on top of it, two
    dried shiitake caps with pale cracks.
  crew: >
    Four tiny people: a photographer on a tiny ladder shooting from above,
    an assistant holding a reflector, a woman turning a giant page of a
    second open blank book on the floor, a director with a blank clipboard.
  claim: Перша японська книга — 1796 рік
  why: Того року Сато Тюрьо видав першу в Японії книгу про вирощування шиїтаке. Частину знань він узяв із китайських записів.
  source: en.wikipedia Shiitake (Satō Chūryō, 1796)
