thoughts:
- key: w12-shiitake-dawn
  topic: Шиїтаке
  day: tue
  slot: dawn
  layout: specimen
  subject: >
    On a low white round pedestal in the middle of the frame lies a short
    section of an oak log with grey bark, and three fresh brown shiitake
    mushrooms grow out of its side.
  crew: >
    Five tiny people: a photographer with a camera on a tripod, an
    assistant holding a round white reflector, a lighting tech next to a
    softbox on a stand, a stylist brushing the bark with a soft brush, a
    director pointing at the mushrooms.
  claim: Один із найдавніших записів — 1209 рік
  why: Тоді в Китаї, за династії Сун, склали «Записи повіту Лунцюань». Там описано, як шиїтаке розводять на колодах.
