  claim: Його латинське імʼя — «їстівний»
  why: Гриб зветься Lentinula edodes, і друге слово латиною означає «їстівний». 1976 року міколог Девід Пеґлер переніс його в рід Lentinula.
  source: en.wikipedia Shiitake (Pegler 1976, edodes = edible)
