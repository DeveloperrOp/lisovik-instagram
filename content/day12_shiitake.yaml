    reflector, a lighting tech next to a softbox. Warm evening light.
  claim: За легендою, його «відкрив» лісоруб
  why: Китайський переказ каже, що лісоруб У Саньгун помітив, як гриби краще ростуть на надрубаних колодах. Тому в Китаї його шанують як батька методу.
  source: maxapress.com panfungi-0026-0003 (легенда, низька впевненість — подано як переказ)
