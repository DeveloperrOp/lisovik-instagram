# Тиждень 12, день 1: Шиїтаке, екстракт 10:1 у капсулах. Подача «фотостудія» (v10).
# product: https://lisovik.com.ua/shyitake-ekstrakt-101-kapsuly-60-sht-po-0.5-h/
# Факти — дослідник 09.11. 1209 рік джерела оспорюють (є версія 1313), тому
# «один із найдавніших». У Саньгун — лише як легенда. Звичайні капсули
# шиїтаке (0.4 г) в оферту не беремо: в описі на сайті «мікродозинг».
# Ціна — за банку на 60, як на фото.
