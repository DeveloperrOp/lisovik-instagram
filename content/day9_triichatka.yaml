  claim: Три трави в одній капсулі
  why: Пижмо, полин і гвоздика у вегетаріанській капсулі. У банці 120 штук.
  do: Шукай посилання в шапці профілю
  source: 'склад у каталозі LIS-469836: пижмо, полин, гвоздика, вегетаріанські капсули'
