thoughts:
- key: w9-triichatka-dawn
  topic: Трійчатка
  day: wed
  slot: dawn
  layout: macro
  subject: >
    a few long sprigs of dried silvery-grey wormwood with finely divided
    feathery leaves and tiny yellowish flower heads, lying loosely on the
    paper.
  claim: Вермут — це просто «полин»
  why: Німецькою полин — Wermut. 1786 року туринський купець Антоніо Бенедетто Карпано першим почав продавати
    напій, названий цим словом.
  do: Знайди полин у складі трійчатки на сайті
  source: en.wikipedia Vermouth (Clarke, SF Chronicle 2008); diffordsguide.com vermouth history
- key: w9-triichatka-morning
  topic: Трійчатка
  day: wed
  slot: morning
  layout: giant
  body: >
    The giant jar stands upright on the left side of the frame. Next to it
    grows a tall stem of silvery wormwood, just as giant as the jar. A WOMAN
    of about fifty-five with silver hair tied in a bun, in a light linen
    dress, waters the wormwood stem with a tiny metal watering can, a calm
    happy face — a feeling of a quiet garden morning.
  details: a few sprigs of silvery wormwood, a few small yellow button flowers of tansy, a few dried
    cloves, a little green moss.
  claim: Карл Великий наказав садити пижмо
  why: Його указ про королівські маєтки, складений близько 800 року, перелічує рослини для кожного саду.
    Пижмо там є — латиною tanazita.
  do: Глянь, які ще дві трави в трійчатці
  source: Capitulare de villis, гл. 70 (zobodat.at VZBG_5_0787-0826.pdf; en.wikipedia Capitulare de villis)
- key: w9-triichatka-noon
  topic: Трійчатка
  day: wed
  slot: noon
  layout: macro
  subject: >
    a small heap of dark brown dried clove buds, each a slim nail with a
    round head, with a few loose cloves scattered around it.
  claim: 1770-го гвоздика втекла з Молукк
  why: Голландці тримали її під своїм контролем, аж поки експедиція, яку послав Пʼєр Пуавр, не вивезла
    саджанці на Маврикій. Так монополія почала розвалюватись.
  do: Понюхай гвоздику з кухні — це той самий бутон
  source: en.wikipedia Pierre Poivre (Corn, The Scents of Eden); nationaalherbarium.nl FMCollectors Provost
- key: w9-triichatka-evening
  topic: Трійчатка
  day: wed
  slot: evening
  layout: macro
  subject: >
    a few stems of tansy with flat clusters of bright golden button flowers
    and dark green fern-like leaves, lying on the paper.
  claim: Пиріг із пижмом — на 20 яєць
  why: 1660 року англійський кухар Роберт Мей записав рецепт «тенсі» з яєць і соку пижма. Сторіччя потому
    журнал «Connoisseur» писав, що пижмо до Великодня — як мінс-пай до Різдва.
  do: Збережи — розкажеш за великоднім столом
  source: Robert May, The Accomplisht Cook (1660), gutenberg.org/ebooks/22790; foodsofengland.info/?p=1363
- key: w9-triichatka-sell
  topic: Трійчатка
  day: wed
  slot: sell
  layout: sell
  body: >
    The giant jar stands upright on the left side of the frame. A cream-white
    linen hammock is tied between the jar and a tall stem of silvery
    wormwood standing on the right, just as giant as the jar. In the hammock
