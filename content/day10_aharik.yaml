  claim: Чому гриб пахне мигдалем
  why: Аромат дає речовина, яку звуть бензальдегідом, — та сама, що пахне в мигдалі. Ще 1922 року міколог
    Вільям Меррілл писав, що мʼякоть смакує як зелені горіхи.
  source: en.wikipedia Agaricus subrufescens (Chen & Wu 1984; Murrill 1922)
- key: w10-aharik-evening
  topic: Агарік бразильський
  day: mon
  slot: evening
  layout: specimen
  subject: >
