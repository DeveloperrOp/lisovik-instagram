thoughts:
- key: w10-aharik-dawn
  topic: Агарік бразильський
  day: mon
  slot: dawn
  layout: specimen
  subject: >
    one dried Agaricus mushroom laid flat as a herbarium specimen — a pale
    brown cap covered with fine brown scales, a thick pale stem with a ring —
    fixed to the paper with thin strips of paper tape, a small blank cream
    tag tied with twine beside it.
  claim: Імʼя він отримав у Нью-Йорку 1893-го
  why: Ботанік Чарльз Пек описав гриб як Agaricus subrufescens. Тож «бразильський» агарік уперше назвали
    в США, задовго до Бразилії.
  source: 'mykoweb.com Agaricus subrufescens (Peck, Rep. N.Y. St. Mus. 46: 105, 1893)'
- key: w10-aharik-morning
  topic: Агарік бразильський
  day: mon
  slot: morning
  layout: jar
  subject: >
    two dried Agaricus mushrooms with pale brown scaly caps fixed with thin
    strips of paper tape, and the product lying on the paper in the lower
    right.
  claim: Його їли в Америці ще у XIX столітті
  why: Наприкінці 1800-х «мигдалевий гриб» вирощували на сході США, а грибницю продавали за каталогами.
    Потім ринок забрала звичайна печериця.
  source: Kerrigan 2005, Mycologia (PubMed 16389952); en.wikipedia Agaricus subrufescens
- key: w10-aharik-noon
  topic: Агарік бразильський
  day: mon
  slot: noon
  layout: specimen
  subject: >
    one dried Agaricus mushroom cut in half lengthwise, showing pale flesh
