# МІФ — розвінчуємо поширену помилкову думку.
# Відрізняється від «помилки»: там неправильна ДІЯ, тут неправильне УЯВЛЕННЯ.
# Структура: що кажуть -> як насправді -> чому так вийшло.
# Замінив рубрику «відгук»: вигадані відгуки — це брехня, а справжніх поки немає.
type: myth
items:
- headline: ГРИБ-ЗОМБІ З СЕРІАЛУ
  claim: Кордицепс керує людьми, як у The Last of Us
  truth: У банці Cordyceps militaris із ферми
  why: Сюжет побудований на Ophiocordyceps unilateralis — грибі, який справді керує поведінкою
    мурах. У добавках його немає в принципі. Це різні види одного роду, приблизно як вовк
    і домашній пес.
  scene: dark blurred forest interior, deep green tones, even texture
  product_hint: Кордицепс
- headline: ДИКЕ ЗАВЖДИ КРАЩЕ
  claim: Дикий кордицепс із гір цінніший за вирощений
  truth: Ціна дикого — про рідкість збору, а не про склад
  why: Дикий синенсис збирають вручну високо в горах, звідси й вартість. Культивований мілітаріс
    містить у рази більше кордицепіну — ключової речовини роду. Дорожче тут не означає насиченіше.
  scene: dark mountain silhouettes heavily blurred, cold muted tones
  product_hint: Кордицепс
- headline: ЧИМ ТЕМНІШЕ, ТИМ КРАЩЕ
  claim: Насичений темний настій чаги — ознака якості
  truth: Колір дає окріп, а не користь
  why: Кип'яток витягує з чаги більше барвників і робить настій темнішим та гіркішим, але
    частина сполук при цьому руйнується. Правильно заварена чага світліша, зате мʼякша на
    смак.
  scene: dark wooden table with a glass far in the background, low warm light
  product_hint: Чага
- headline: ЕКСТРАКТ — ЦЕ ХІМІЯ
  claim: Екстракт роблять із порошків у лабораторії
  truth: Це просто виварювання водою
  why: Гарячу воду ганяють крізь сировину, а потім випарюють — лишається концентрат. Жодних
    синтетичних додатків там немає, це той самий гриб, тільки щільніший.
  scene: dark surface with soft steam-like haze, minimal and quiet
- headline: ВСІ ГРИБИ ОДНАКОВІ
  claim: Різниця між видами — лише в назві на банці
  truth: У кожного свій склад і свій спосіб вживання
  why: Чагу заварюють, рейші томлять годину, їжовик додають у їжу, шиітаке смажать. Це різні
    продукти з різною сировиною, і плутати їх — те саме, що плутати гречку з рисом.
  scene: dark stone surface with soft directional light, empty composition
- headline: ПОРОШОК МАЄ РОЗЧИНЯТИСЬ
  claim: Якщо на дні осад — значить продукт поганий
  truth: Грибний порошок не розчиняється в принципі
  why: Він лише розходиться в рідині, як какао чи мелена кориця. Осад на дні — це нормальна
    фізика, а не брак. У гарячому розходиться охайніше, у холодному злипається грудками.
  scene: very dark neutral background with soft side light, no objects
- headline: ГРИБИ ТРЕБА ЇСТИ СВІЖИМИ
  claim: Сушені гриби втрачають усе корисне
  truth: Сушіння — це спосіб зберегти, а не зіпсувати
  why: Свіжий гриб — це переважно вода, і живе він кілька днів. Сушіння прибирає вологу, лишає
    сировину і дає їй рік-два життя. Саме тому сушать, а не морозять.
  scene: wooden drying rack heavily blurred, warm daylight, calm
