    - Усі 9 незамінних амінокислот
    - Стінка мʼяка — обробка не потрібна
    - Смак мʼякший, простіше почати
    - Дешевша за грам
  - title: ХЛОРЕЛА
    points:
    - 55,6 г білка на 100 г
    - Найбільше хлорофілу серед водоростей
    - Стінка целюлозна — має бути розкрита
    - Смак насиченіший, травʼяний
    - Дорожча через обробку стінки
