# ЩО ОБРАТИ — два варіанти поруч. Допомагає визначитися й підводить до покупки.
# Обидва варіанти подаємо чесно: у кожного своя перевага, поганих немає.
type: compare
items:
- headline: ПОРОШОК ЧИ КАПСУЛИ
  options:
  - title: ПОРОШОК
    points:
    - Дешевше в перерахунку на порцію
    - Легко додати в кашу чи смузі
    - Сам регулюєш обʼєм
    - Смак відчувається
    - Фарбує руки й посуд
  - title: КАПСУЛИ
    points:
    - Смаку немає взагалі
    - Зручно брати з собою
    - Нічого не відмірювати
    - Дорожче за грам
    - Не додаси у страву
  scene: very dark blurred forest background, deep green tones, even texture
- headline: ЦІЛІ ЧИ МЕЛЕНІ
  options:
  - title: ЦІЛІ
    points:
    - Зберігаються довше
    - Можна заварювати повторно
    - Видно, що саме ти купив
    - Треба час на відвар
  - title: МЕЛЕНІ
    points:
    - Готові до вживання одразу
    - Легко вкинути в їжу
    - Віддають усе за одне заварювання
    - Швидше вбирають вологу
  scene: dark neutral surface with soft shadow gradient, no objects
- headline: ЕКСТРАКТ ЧИ СИРОВИНА
  options:
  - title: ЕКСТРАКТ
    points:
    - Концентрат — порція менша
    - Банки вистачає надовше
    - Дорожча за банку
    - Смак насиченіший
  - title: СИРОВИНА
    points:
    - Ближче до звичайної їжі
    - Дешевша за банку
    - Витрачається швидше
    - Мʼякший смак
  scene: deep shadowed forest floor, muted brown and green
- headline: ЇЖОВИК ЧИ КОРДИЦЕПС
  options:
  - title: ЇЖОВИК
    points:
    - Мелені плодові тіла, не міцелій
    - Нейтральніший смак у страві
    - Беруть зранку або вдень
    - Добре йде в кашу і смузі
  - title: КОРДИЦЕПС
    points:
    - Вирощений на пшениці, вегетаріанський
    - Яскраво-помаранчевий, ні з чим не сплутаєш
    - Беруть до обіду, не на ніч
    - Класика для активних днів
  scene: dark split background, one side cooler one side warmer, abstract
- headline: ЧАГА ЧИ ТРАВʼЯНИЙ ЧАЙ
  options:
  - title: ЧАГА
    points:
    - Один гриб, зібраний з берези
    - Темний насичений настій
    - Куски заварюють по кілька разів
    - Потребує 60-80 °C і 15 хвилин
  - title: ТРАВИ
    points:
    - Збір із кількох рослин
    - Легший смак і більше аромату
    - Заварюється за 5-7 хвилин
    - Простіше пити щодня
  scene: dark wooden table surface in low light, empty and calm
- headline: ОКРЕМО ЧИ КУРСОМ
  options:
  - title: ОКРЕМО
    text: Спробувати один гриб
  - title: КУРСОМ
    text: Готовий набір на місяць
  scene: dim shelf with blurred containers, warm low light
- headline: СПІРУЛІНА ЧИ ХЛОРЕЛА
  options:
