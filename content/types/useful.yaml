# КОРИСНЕ — головний освітній тип. Одна сторіс = одна думка, розкрита до кінця.
# Теми зібрані ресерчем реальних запитань людей, не вигадані.
# Заборонено: медичні обіцянки, мухомор, лотос, кава/лате/какао/матча, Карпати, дозування.
type: useful
items:
- headline: ПЛОДОВЕ ТІЛО ЧИ МІЦЕЛІЙ
  body: Міцелій вирощують на зерні, і відділити його від зерна в промислових масштабах нереально
    — мелють усе разом. Тому в такому порошку велика частина ваги це крохмаль субстрату, а
    не гриб. Плодове тіло — це сам гриб, який виріс і який зібрали. Різниця у вмісті бета-глюканів
    там не на відсотки, а в рази.
  tip: Шукай на етикетці напис «плодове тіло».
  scene: dark wooden table, glass teapot far in the background, warm side light, plenty of
    empty dark space
- headline: ПОЛІСАХАРИДИ — НЕ ТЕ САМЕ
  body: «Полісахариди 40%» виглядає солідно, але в це число входить і звичайний крохмаль із
    зернового субстрату. Бета-глюкани — те, заради чого гриб узагалі беруть, і їхній відсоток
    завжди менший, зате чесний. Виробникам вигідно писати більшу цифру і мовчати про меншу,
    бо перевіряти її ніхто не біжить.
  tip: Питай відсоток бета-глюканів, а не полісахаридів.
  scene: very dark neutral surface with soft side light, empty and calm
- headline: ЧАГУ НЕ ЗАЛИВАЮТЬ ОКРОПОМ
  body: 'Чага — не пакетик чаю. Воду гріють приблизно до 60-80°C: це коли з чайника вже йде
    пара, але він ще не закипів. Окріп робить настій мутнішим і помітно гіркішим, бо частина
    сполук у чазі термочутлива. Тому просто зніми чайник трохи раніше або дай воді дві хвилини
    постояти після кипіння.'
  tip: Закипіло — почекай дві хвилини, потім заливай.
  scene: dark blurred forest interior, deep green tones, even texture, no focal point
- headline: ЧОМУ ПОРОШОК ГРУДКУЄТЬСЯ
  body: Грибний порошок не розчиняється, як цукор, — він лише розходиться в рідині. У холодній
    воді чи соку частинки злипаються між собою і падають на дно, тому в склянці лишаються
    грудки й осад. У гарячій рідині все розходиться значно охайніше, особливо якщо мішати
    одразу, а не через хвилину.
  tip: Заливай гарячим і розмішуй одразу, не потім.
  scene: dark matte surface with a soft pool of warm light on one side, no objects
- headline: НА СКІЛЬКИ ВИСТАЧАЄ ПАКЕТА
  body: 'Це варто порахувати ще до покупки. Звичайний пакет порошку — це приблизно шість десятків
    порцій по рівній чайній ложці, тобто близько двох місяців щоденного вживання. Саме тому
    ціна за пакет — так собі орієнтир: поділи її на кількість порцій, і стане видно, скільки
    насправді коштує день.'
  tip: Рахуй ціну за день, а не суму на ціннику.
  scene: dark kitchen counter heavily blurred, warm low light, empty middle
- headline: ЩО ОЗНАЧАЄ 10:1 НА БАНЦІ
  body: 'Це співвідношення екстракції: з десяти частин сировини зробили одну частину концентрату.
    Проблема в тому, що цифра ніким не стандартизована і незалежно не перевіряється — два
    продукти з однаковим «10:1» можуть відрізнятися в рази. А якщо співвідношення не вказане
    взагалі, часто це просто мелений гриб.'
  tip: Дивись на бета-глюкани, а не на красиву пропорцію.
  scene: deep shadowed forest floor, muted brown and green, calm and even
- headline: ЇЖОВИК У ПОРОШКУ НЕ КРАБ
  body: 'Свіжий їжовик, порваний руками й підсмажений на маслі, справді нагадує краба — за
    це відповідає та сама летка речовина, що дає аромат вареним креветкам. Але сушіння й помел
    цей профіль змінюють: у порошку смак стає землистим, з легкою гіркуватістю. Це нормальна
    поведінка продукту, а не брак.'
  tip: Не їж порошок окремо — ховай його у страву.
  scene: very dark green gradient with faint fern silhouettes at the edges
- headline: КУДИ ДОДАВАТИ ПОРОШОК
  body: Найпростіше — туди, де вже є свій сильний смак. Вівсянка, смузі з бананом, густий
    йогурт, суп за кілька хвилин до готовності. У фруктовому смузі землистий присмак губиться
    майже повністю, у каші його прикриває жир з молока чи горіхової пасти. А от у чистій воді
    буде чути кожну ноту.
  tip: Обери страву з жиром або яскравим фруктом.
  scene: dark wooden table, glass teapot far in the background, warm side light, plenty of
    empty dark space
- headline: КОРДИЦЕПС РОСТЕ НА ЗЕРНІ
  body: Картинка з гусеницею, яку всі бачили, стосується дикого Cordyceps sinensis з тибетських
    гір. Комерційний мілітаріс вирощують на фермі на зерновому субстраті — рис або соя, —
    і жодна комаха в процесі не бере участі. Саме тому він доступний за ціною і не викликає
    етичних питань у вегетаріанців.
  tip: Мілітаріс — це ферма і зерно, без комах.
  scene: dark blurred forest interior, deep green tones, even texture, no focal point
- headline: РЕЙШІ НЕ СМАЖАТЬ
  body: Рейші — не кулінарний гриб. Зрілий трутовик твердий, як деревина, і гіркий; порізати
    його в сковорідку не вийде навіть фізично. Його беруть тільки як довгий відвар, порошок
    або екстракт. Якщо десь трапляється рецепт «обсмажте рейші з часником» — автор рейші в
    руках точно не тримав.
  tip: Рейші — у горнятко, а не на сковорідку.
  scene: dark kitchen counter heavily blurred, warm low light, empty middle
- headline: РЕЙШІ ТОМЛЯТЬ ГОДИНАМИ
  body: 'П''ять хвилин заварювання з рейші не працюють: структура гриба щільна, і вода за
    такий час просто не встигає нічого з неї витягнути. Класика — нарізаний гриб на малому
    вогні від сорока хвилин до двох годин, без бурхливого кипіння. Гіркоту потім балансують
    медом, імбиром, корицею чи цедрою.'
  tip: Постав на найменший вогонь і забудь на годину.
  scene: deep shadowed forest floor, muted brown and green, calm and even
- headline: ЧАГУ ЗАВАРЮЮТЬ ПОВТОРНО
  body: 'Кускову чагу не викидають після першої чашки. Джерела розходяться в цифрах — хтось
    каже про два-три рази, українські гайди про п''ять, — але сходяться в головному: найнасиченішими
    часто виходять третє й четверте заварювання. Орієнтир простий і чесний: заливай, поки
    настій дає колір.'
  tip: Не викидай чагу, поки вона фарбує воду.
  scene: dark stone surface with soft directional light, minimal and quiet
- headline: КУСКОВА ЧИ МЕЛЕНА ЧАГА
  body: 'Куски — для тих, хто ставить чагу надовго: вони повільно віддають смак і витримують
    кілька заварювань поспіль. Мелена готова за десять-тридцять хвилин, але віддає все за
    один раз, і заварювати її вдруге вже майже нема сенсу. Через велику площу вона ще й швидше
    набирає вологу при зберіганні.'
  tip: Часто вдома — куски. Треба швидко — мелена.
  scene: very dark green gradient with faint fern silhouettes at the edges
- headline: ЯК ВПІЗНАТИ СПРАВЖНЮ ЧАГУ
  body: Головна перевірка — розлам. Ззовні справжня чага чорна, потріскана й груба, а всередині
    яскраво-руда, жовто-коричнева, за текстурою схожа на корок. Немає такої серцевини — це
    або взагалі не чага, або сировина сумнівна. Форма при цьому завжди безформна, без акуратного
    «копитця» збоку.
  tip: Проси фото розламу, а не тільки чорну шкоринку.
  scene: dark wooden table, glass teapot far in the background, warm side light, plenty of
    empty dark space
- headline: ЯКА ЧАГА НА СМАК
  body: 'Найчастіше бояться гіркоти, а чага в чашці м''яка: деревна, з ванільно-горіховим
    відтінком, схожа на слабкий чорний чай або пуер. Виражена гіркота — це майже завжди перегріта
    вода чи перетримка, а не властивість гриба. Тобто якщо гірчить, питання радше до чайника,
    ніж до сировини.'
  tip: Гірчить — знизь температуру і скороти час.
  scene: very dark neutral surface with soft side light, empty and calm
- headline: ПОДВІЙНА ЕКСТРАКЦІЯ НЕ ВСІМ
  body: Слово «подвійна» звучить як преміум, але сенс воно має не для кожного гриба. Рейші
    й чазі спирт потрібен, бо їхні тритерпени у воді не розчиняються. А в їжовика й кордицепса
    головне — водорозчинні бета-глюкани, і спирт частину з них просто осаджує та відфільтровує
    з готового продукту.
  tip: Для їжовика й кордицепса шукай водну екстракцію.
  scene: dark blurred forest interior, deep green tones, even texture, no focal point
- headline: 'ХЛОРЕЛА: РОЗКРИТА СТІНКА'
  body: 'Клітинна стінка хлорели зроблена з целюлози, а людина целюлозу не перетравлює. Тому
    якісну хлорелу механічно «розкривають» — руйнують стінку перед фасуванням. Без цього чимала
    частина того, за що ти платиш, проходить транзитом. Спіруліні така обробка не потрібна
    взагалі: у неї стінка м''яка.'
  tip: На упаковці має бути «розкрита клітинна стінка».
  scene: dark matte surface with a soft pool of warm light on one side, no objects
- headline: ЗЕЛЕНІ ЗУБИ — ЦЕ ХЛОРОФІЛ
  body: 'Найчастіший переляк новачка: випив зелене — а зуби й язик зелені. Це поверхневе забарвлення
    хлорофілом, звичайним рослинним пігментом, а не реакція організму й не ознака поганої
    партії. Тримається воно рівно доти, доки ти не прополощеш рот, і трапляється з будь-яким
    брендом.'
  tip: Прополощи рот одразу після прийому — і все.
  scene: deep shadowed forest floor, muted brown and green, calm and even
- headline: ЗВІДКИ ВОДОРІСТЬ РОДОМ
  body: 'Спіруліна й хлорела — біоакумулятори: вони вбирають з води все, що в ній є, включно
    з важкими металами. Незалежне тестування знаходило перевищення норм по свинцю навіть у
    частини «органічних» продуктів. Тому питання не в тому, органічна вона, а в тому, чи є
    лабораторні протоколи.'
  tip: Питай у продавця протокол лабораторного тесту.
  scene: dark stone surface with soft directional light, minimal and quiet
- headline: ЩО В ТАБЛЕТЦІ, КРІМ ВОДОРОСТІ
  body: 'Таблетка — це спресований порошок, і щоб вона трималася купи, туди додають зв''язуючі:
    целюлозу, стеарат магнію, діоксид кремнію. Це може бути помітна частина ваги. Тобто вага
    таблетки і вага самої водорості в ній — різні числа, і саме це варто дивитись, коли порівнюєш
    дві банки за ціною.'
  tip: Порівнюй склад, а не вагу таблетки.
  scene: very dark green gradient with faint fern silhouettes at the edges
- headline: СКІЛЬКИ ЖИВЕ ВІДКРИТА БАНКА
  body: 'Закрита упаковка спокійно стоїть рік-два, а от після відкриття відлік інший — кілька
    місяців, бо всередину потрапляють повітря й волога. Ознаки, що час прощатися: грудки,
    потемніння кольору, кислуватий або затхлий запах. Свіжий порошок пахне грибом і сиплеться
    вільно, без грудок.'
  tip: Підпиши на банці дату, коли її відкрив.
  scene: very dark neutral surface with soft side light, empty and calm
- headline: ГІРКОТУ ЗНІМАЄ ЖИР
  body: 'Порошок ашваганди гіркий, землистий і терпкий — новачки часто пробують його у воді
    й більше до нього не повертаються. Річ у тім, що гіркі сполуки кореня жиророзчинні: вода
    й прозорий сік їх не тримають. Тепле молоко, горіхова паста чи банан у смузі справляються
    з цим значно краще.'
  tip: Розмішуй у чомусь жирному, а не у воді.
  scene: dark blurred forest interior, deep green tones, even texture, no focal point
- headline: АШВАГАНДА ЛЮБИТЬ ЇЖУ
  body: Порада «пити натще» перекочувала з традиційних рецептів, але на практиці корінь на
    порожній шлунок часто дає дискомфорт. Простіше приймати його разом з їжею або запивати
    теплим молоком — так менше шансів, що шлунок відповість своє. Це побутова порада зі здорового
    глузду, не медична схема.
  tip: Прив'яжи прийом до сніданку або вечері.
  scene: dark matte surface with a soft pool of warm light on one side, no objects
- headline: НЕ ВСІ АДАПТОГЕНИ НА ВЕЧІР
  body: Типова помилка — вважати всі адаптогени взаємозамінними. Ашваганду традиційно ставлять
    на вечір, а родіолу й женьшень — на ранок чи першу половину дня, бо вони виражено тонізують.
    Якщо переплутати їх місцями, ввечері отримаєш зовсім не те, чого чекав. Кордицепс теж
    радше ранкова історія.
  tip: Тонізуючі — зранку, ашваганду — ближче до вечора.
  scene: dark kitchen counter heavily blurred, warm low light, empty middle
- headline: ШИІТАКЕ НЕ ЇДЯТЬ СИРИМ
  body: 'Сушений шиітаке спершу замочують, а потім обовʼязково проварюють або просмажують
    — сирим його не вживають, це кулінарне правило саме для цього гриба. Замочування дає ще
    й бонус: вода з-під грибів стає готовою основою для бульйону чи соусу.'
  tip: Замочив — провари, а воду не виливай.
  scene: deep shadowed forest floor, muted brown and green, calm and even
- headline: КОРДИЦЕПС РОСТЕ НА ЗЕРНІ
  body: Картинка з гусеницею, яку всі бачили, стосується дикого виду з тибетських гір. Комерційний
    мілітаріс вирощують на фермі на зерновому субстраті — рис або соя. Жодна комаха в процесі
    не бере участі, тому він доступний за ціною і підходить вегетаріанцям.
  tip: Мілітаріс — це ферма і зерно, без комах.
  scene: dark neutral surface with soft warm light on one side, no objects
  product_hint: Кордицепс
- headline: ЧОМУ ЇЖОВИК ТАКИЙ ЛЕГКИЙ
  body: Банка виглядає майже порожньою, і це лякає при першій покупці. Сушений гриб втрачає
    близько девʼяноста відсотків ваги — це була вода. Тому пʼятдесят грамів сушеного це чималий
    обсяг свіжого, а порція виходить маленькою за вагою.
  tip: Легка банка — ознака сушіння, а не обману.
  scene: dark wooden shelf heavily blurred, warm low light, empty space
  product_hint: Їжовик
- headline: ЩО РОБИТИ З ОСАДОМ
  body: 'На дні горнятка після грибного напою лишається осад — це нерозчинна частина порошку.
    Її не треба виливати: саме там збирається левова частка того, за що ти платив. Просто
    розмішай ще раз і допий, або з''їж ложкою.'
  tip: Осад — це продукт, а не бруд. Не виливай.
  scene: dark table with a cup far out of focus, single soft highlight
  product_hint: ''
- headline: ЩО ТАКЕ ТРАВʼЯНИЙ ЗБІР
  body: 'Це не один компонент, а суміш кількох рослин, підібраних під смак і аромат. Саме
    тому збори між собою так відрізняються: змінюється пропорція — змінюється весь характер
    напою. І саме тому збір заварюється швидше за гриб: у рослин немає щільної структури.'
  tip: Заварюй 5-7 хвилин, довше не треба.
  scene: wooden tray with dried herbs heavily blurred, soft window light
  product_hint: Чай
- headline: ЧОМУ ЗБІР ПАХНЕ СИЛЬНІШЕ
  body: 'Аромат тримається на ефірних оліях, а вони летючі. Тому щойно відкрита пачка пахне
    яскравіше за ту, що місяць стояла відкритою. Це не про якість, а про фізику: олії вивітрюються.
    Щільна кришка і темне місце зберігають запах помітно довше.'
  tip: Тримай збір щільно закритим, подалі від світла.
  scene: dark shelf with a closed jar far out of focus, warm dim light
  product_hint: Чай
- headline: ТРЕМЕЛА — ГРИБ-ЖЕЛЕ
  body: 'Її ще звуть сніжним грибом: у воді вона розбухає і стає майже прозорою, желейною.
    В азійській кухні тремелу століттями кладуть у солодкі супи й десерти саме за текстуру.
    Смак у неї майже нейтральний, тому вона не сперечається з іншими інгредієнтами.'
  tip: Замочи в холодній воді — побачиш, як розкриється.
  scene: translucent white shapes on dark surface, soft backlight, abstract
  product_hint: Тремела
