# ПОМИЛКА НОВАЧКА — найцікавіший формат: люди впізнають себе.
# Структура: що роблять не так -> як краще -> чому це важливо.
type: mistake
items:
- headline: ЛІЗУТЬ У БАНКУ МОКРОЮ ЛОЖКОЮ
  wrong: Беруть порошок вологою ложкою і тримають банку біля плити
  right: Суха ложка, щільна кришка, сухе прохолодне місце без сонця
  why: Порошок гігроскопічний і тягне вологу з повітря. Волога дає спочатку грудки, потім
