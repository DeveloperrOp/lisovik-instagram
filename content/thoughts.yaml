thoughts:
- key: cold-first
  topic: Мелені гриби в гарячому напої
  claim: Спершу ложка холодного, потім гаряче
  why: 'В окропі порошок береться грудками: зовні заварюється, а всередині лишається сухим. У холодній
    рідині він розходиться рівно'
  do: Розмішай у ложці холодної, тоді долий гаряче
  layout: steps
  extra: Насип порошок у чашку|Розітри з ложкою холодної води|Долий гаряче і розмішай
- key: powder-not-soluble
  topic: Мелені плодові тіла
  claim: Порошок не розчиняється у воді
  why: 'Плодові тіла — це переважно волокно, воно осідає на дні склянки. У густому тримається рівно: каша,
    йогурт, смузі, какао.'
  do: Розмішай у щось густе, а не у склянку води
  layout: steps
  extra: 'Насип у щось густе: каша, йогурт, смузі|Розмішай до рівного кольору|Їж одразу, поки не осіло'
- key: one-at-a-time
  topic: Початок прийому
  claim: Починай з одного, а не з трьох одразу
  why: Якщо взяти все разом, потім не розбереш, що саме тобі підійшло, а що ні. Один продукт за раз дає
    чесну відповідь.
  do: Візьми щось одне і не додавай нічого зверху
  layout: steps
  extra: Обери один продукт|Тримай його тиждень-другий|Тоді додай наступний
- key: lid-on-cup
  topic: Трав'яні чаї
  claim: Накрий чашку — аромат іде з парою
  why: 'Ефірні олії трав летючі: з відкритого горнятка вони підіймаються разом із парою, і в чашці лишається
    бліда вода замість настою'
  do: Накрий блюдцем на п'ять-сім хвилин
  layout: callout
  extra: —
- key: chaga-birch-growth
  topic: 'Чага березова: де росте і як виглядає'
  claim: Чага — наріст на березі, а не гриб на ніжці
  why: Вона роками живиться соками живого дерева, тому зовні чорна й потріскана, а на зламі — руда й щільна,
    як деревина.
  do: 'Перевір злам: рудий шар — те, що треба'
  layout: callout
  extra: —
- key: fridge-ruins-powder
  topic: Зберігання порошку
  claim: Холодильник псує порошок швидше за шафу
  why: Холодна банка збирає конденсат щоразу, як ти її відкриваєш. Волога всередині — це спочатку грудки,
    потім затхлий запах.
  do: Постав банку в суху шафу, подалі від плити
  layout: callout
  extra: —
- key: honey-after-cooling
  topic: Мед у грибному чаї
  claim: Мед — у тепле, не в окріп
  why: 'Приблизно від 60 °C аромат і ферменти меду руйнуються: у крутому окропі від ложки лишається сама
    солодкість'
  do: Дай чашці охолонути до питної — тоді клади мед
  layout: stat
  extra: 60 °C
- key: extract-ten-to-one
  topic: Екстракт 10:1
  claim: 10:1 — це десять частин сировини в одній
  why: Сировину виварюють, а витяжку сушать — вода йде, лишається концентрат. Тому порція менша, а банки
    вистачає надовше.
  do: Рахуй ціну не за банку, а за кількість порцій
  layout: stat
  extra: '10:1'
- key: extract-just-stir
  topic: 'Екстракт: як приймати'
  claim: Екстракт не заварюють — його розмішують
  why: 'Витяжку вже зробили на виробництві: сировину виварили і випарили до порошку. Удома лишається тільки
    розвести його в рідині'
  do: Розмішай у воді чи каві — гарячій або холодній
  layout: versus
  extra: 'Порошок: заварюєш|Екстракт: розмішуєш'
- key: whole-vs-ground
  topic: Ціле проти меленого
  claim: Ціле заварюють повторно, мелене — раз
  why: Вода поволі заходить у цілий шматок, тому він віддає поступово. У меленого поверхня відкрита —
    усе виходить за перше заварювання.
  do: Бери шматки на чай, а мелене — в їжу чи смузі
  layout: versus
  extra: 'ЦІЛЕ: довге заварювання, кілька заходів|МЕЛЕНЕ: усе за одне заварювання'
- key: morning-evening
  topic: Кордицепс і ашваганда
  claim: Кордицепс — на ранок, ашваганда — на вечір
  why: Кордицепс беруть перед активною частиною дня, ашваганду — коли день уже закінчено. Поміняєш місцями
    — і кожен не у своєму часі.
  do: Пий кордицепс до обіду, ашваганду — після вечері
  layout: versus
  extra: 'Ранок: кордицепс, женьшень|Вечір: ашваганда, чага'
- key: chaga-second-pour
  topic: Чага березова, ціла
  claim: Один шматок чаги — не одна чашка
  why: 'Щільна тканина віддає воді поступово: другий залив ще темний і має смак, а після третього в чайнику
    вже майже сама вода'
  do: Залий той самий шматок ще раз того ж дня
  layout: scale
  extra: Перший залив — третій залив
- key: taste-picks-form
  topic: Вибір форми за смаком
  claim: Гірке бери в капсулах, нейтральне — меленим
  why: Чага і рейші гіркуваті — у страві це чути одразу. Їжовик і кордицепс майже без смаку, вони не перебивають
    ні кашу, ні смузі.
  do: Форму обирай під смак, а не під ціну банки
  layout: scale
  extra: 'гірке: чага, рейші — нейтральне: їжовик, кордицепс'
- key: with-food
  topic: 'Час прийому: порошок і їжа'
  claim: Порошок іде з їжею, а не натщесерце
  why: Мелене плодове тіло — це передусім волокно. На порожній шлунок воно чується помітніше, ніж коли
    ложка йде в кашу чи в каву.
  do: Додай ложку до сніданку, а не замість нього
  layout: card
  extra: —
- key: reishi-woody
  topic: 'Рейші: чому його не їдять, а заварюють'
  claim: Рейші твердий, як шматок деревини
  why: Він росте на пнях і сухих стовбурах, і плодове тіло в нього здерев'яніле, з блискучою лакованою
    шапкою. Жувати його марно.
  do: Бери рейші заваркою або екстрактом
  layout: card
  extra: —
- key: rhythm
  topic: Ритм прийому
  claim: Тут вирішує ритм, а не окремий день
  why: 'Це не таблетка за потреби: адаптогени беруть щодня і в той самий час. Пропустив тиждень — ритм
    губиться, і подвійна порція не поверне.'
  do: Постав банку там, де вже стоїть твоя кава
  layout: title_sub
  extra: —
- key: lionsmane-spines
  topic: 'Їжовик гребінчастий: як він виглядає'
  claim: У їжовика немає ні шапки, ні ніжки
  why: Він росте на рані листяного дерева білою кулею з м'яких голок, що звисають донизу. Спори падають
    прямо з цих голок.
  do: Шукай білу «бороду» на стовбурі, а не шапку
  layout: title_sub
  extra: —
- key: fruitbody-vs-mycelium
  topic: Плодові тіла проти міцелію
  claim: Плодове тіло і міцелій — різні речі
  why: Плодове тіло — сам гриб, який зрізали з деревини. Міцелій вирощують на зерні й мелють разом із
    ним, тож у порошку є й зерно.
  do: 'Перевір етикетку: там написано «плодові тіла»'
  layout: bullets
  extra: Плодове тіло — сам гриб|Міцелій росте на зерні, носій лишається|У складі це видно словами
- key: not-all-mushrooms
  topic: 'Асортимент: де гриб, де корінь, де водорість'
  claim: Не все на полиці — гриби
  why: Ашваганда й женьшень — це сушені корені рослин, а спіруліна й хлорела — прісноводні водорості.
    Грибів серед них немає.
  do: 'Перевір склад: гриб, корінь чи водорість'
  layout: bullets
  extra: 'Гриби: їжовик, чага, рейші, кордицепс|Корені: ашваганда, женьшень|Водорості: спіруліна, хлорела'
- key: spirulina-not-boiled
  topic: Спіруліна і хлорела
  claim: Спіруліну не заварюють окропом
  why: Від гарячої води вона згортається в грудки й темніє, а смак стає різкішим. У прохолодній воді порошок
    розходиться рівно.
  do: Розмішай у прохолодній воді або в смузі
  layout: bullets
  extra: Окріп — грудки й темний колір|Прохолодна вода — рівний розчин|Смузі чи сік — смаку майже не чути
