thoughts:
- key: shiitake-people-ate
  topic: Шиїтаке
  layout: card
  extra: ''
  compound: ''
  source: Dai 2015, 52 здорових 21-41, цілі сушені шиїтаке щодня, 4 тижні
  claim: «Усе на мишах, а люди це їли?»
  why: 'Їли. 52 дорослих чотири тижні клали сушений шиїтаке у звичайну їжу, кров брали до і після. Показники
    крові зрушили. Плацебо-групи там не було: порівнювали дві різні порції між собою.

    '
  do: Клади сушений шиїтаке в суп двічі на тиждень
- key: mushroom-coffee-loss
  topic: Грибна кава
  layout: versus
  extra: 'Сирий гриб: більше|Готова кава: менше'
  compound: кордицепін
  source: лабораторний аналіз складу грибної кави проти сирої сировини
  claim: «Візьму грибну каву — і те, і те разом»
  why: Так виходить гірша угода. Головну речовину кордицепса звуть кордицепіном, і в готовій каві її лишається
    приблизно вп'ятеро менше, ніж у сирому грибі. Обсмажування забирає своє.
  do: Бери каву окремо, а гриб — ложкою в неї
- key: ginseng-single-dose
  topic: Женьшень
  layout: card
  extra: ''
  compound: ''
  source: Northumbria University, G115, 30 здорових, разовий прийом
  claim: «Це ж пити місяцями, а мені треба зараз»
  why: 'Не обовʼязково. У британській роботі 30 людей рахували в умі довгими серіями. Після одного прийому
    женьшеню вони помилялись рідше і нижче оцінювали власну втому — і так усю серію до кінця.

    '
  do: Візьми капсулу за годину до довгої задачі
