- id: w1-mon-morning
  week: 1
  day: mon
  slot: morning
  kind: useful
  theme: Їжовик
  mode: auto
  scene: very dark green gradient with faint fern silhouettes at the edges
  headline: ЇЖОВИК У ПОРОШКУ НЕ КРАБ
  body: 'Свіжий їжовик, порваний руками й підсмажений на маслі, справді нагадує краба — за це відповідає
    та сама летка речовина, що дає аромат вареним креветкам. Але сушіння й помел цей профіль змінюють:
    у порошку смак стає землистим, з легкою гіркуватістю. Це нормальна поведінка продукту, а не брак.'
  tip: Не їж порошок окремо — ховай його у страву.
