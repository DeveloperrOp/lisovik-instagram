- id: w1-tue-morning
  week: 1
  day: tue
  slot: morning
  kind: useful
  theme: Чага
  mode: auto
  scene: dark blurred forest interior, deep green tones, even texture, no focal point
  headline: ЧАГУ НЕ ЗАЛИВАЮТЬ ОКРОПОМ
  body: 'Чага — не пакетик чаю. Воду гріють приблизно до 60-80°C: це коли з чайника вже йде пара,
    але він ще не закипів. Окріп робить настій мутнішим і помітно гіркішим, бо частина сполук у чазі
    термочутлива. Тому просто зніми чайник трохи раніше або дай воді дві хвилини постояти після кипіння.'
  tip: Закипіло — почекай дві хвилини, потім заливай.
