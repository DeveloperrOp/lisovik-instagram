  kind: useful
  theme: Рейші
  mode: auto
  scene: dark kitchen counter heavily blurred, warm low light, empty middle
  headline: РЕЙШІ НЕ СМАЖАТЬ
  body: Рейші — не кулінарний гриб. Зрілий трутовик твердий, як деревина, і гіркий; порізати його
    в сковорідку не вийде навіть фізично. Його беруть тільки як довгий відвар, порошок або екстракт.
    Якщо десь трапляється рецепт «обсмажте рейші з часником» — автор рейші в руках точно не тримав.
  tip: Рейші — у горнятко, а не на сковорідку.
