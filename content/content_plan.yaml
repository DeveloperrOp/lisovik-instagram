  body: 'Це варто порахувати ще до покупки. Звичайний пакет порошку — це приблизно шість десятків
    порцій по рівній чайній ложці, тобто близько двох місяців щоденного вживання. Саме тому ціна
    за пакет — так собі орієнтир: поділи її на кількість порцій, і стане видно, скільки насправді
    коштує день.'
  tip: Рахуй ціну за день, а не суму на ціннику.
