- id: w1-fri-morning
  week: 1
  day: fri
  slot: morning
  kind: useful
  theme: Ашваганда
  mode: auto
  scene: dark blurred forest interior, deep green tones, even texture, no focal point
  headline: ГІРКОТУ ЗНІМАЄ ЖИР
  body: 'Порошок ашваганди гіркий, землистий і терпкий — новачки часто пробують його у воді й більше
    до нього не повертаються. Річ у тім, що гіркі сполуки кореня жиророзчинні: вода й прозорий сік
    їх не тримають. Тепле молоко, горіхова паста чи банан у смузі справляються з цим значно краще.'
  tip: Розмішуй у чомусь жирному, а не у воді.
