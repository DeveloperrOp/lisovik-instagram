- id: w1-thu-morning
  week: 1
  day: thu
  slot: morning
  kind: useful
  theme: Кордицепс
  mode: auto
  scene: dark blurred forest interior, deep green tones, even texture, no focal point
  headline: КОРДИЦЕПС РОСТЕ НА ЗЕРНІ
  body: Картинка з гусеницею, яку всі бачили, стосується дикого Cordyceps sinensis з тибетських гір.
    Комерційний мілітаріс вирощують на фермі на зерновому субстраті — рис або соя, — і жодна комаха
    в процесі не бере участі. Саме тому він доступний за ціною і не викликає етичних питань у вегетаріанців.
  tip: Мілітаріс — це ферма і зерно, без комах.
