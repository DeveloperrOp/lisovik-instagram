- id: w1-wed-morning
  week: 1
  day: wed
  slot: morning
  kind: useful
  theme: Спіруліна
  mode: auto
  scene: dark stone surface with soft directional light, minimal and quiet
  headline: ЗВІДКИ ВОДОРІСТЬ РОДОМ
  body: 'Спіруліна й хлорела — біоакумулятори: вони вбирають з води все, що в ній є, включно з важкими
    металами. Незалежне тестування знаходило перевищення норм по свинцю навіть у частини «органічних»
    продуктів. Тому питання не в тому, органічна вона, а в тому, чи є лабораторні протоколи.'
  tip: Питай у продавця протокол лабораторного тесту.
