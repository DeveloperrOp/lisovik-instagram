# Один день целиком: ежовик гребенчатый, четыре кадра-плаката.
#
# ПОЧЕМУ ПЕРЕПИСАНО. Первая версия этого дня была верной по содержанию и
# неверной по формату: тезис плюс абзац в 180 знаков плюс вывод. Это
# вёрстка карусели, а не сторис. Сторис смотрят на свайпе, и абзац там не
# читает никто. Цель трека — прогрев и доверие, значит кадр обязан
# успеть прочитаться целиком, а не начаться.
#
# Текст ужат втрое, кегль вырос вдвое. Мысль осталась замкнутой: крючок,
# одна строка сути, одно действие.
#
# ЧТО УБРАНО. Кадр «плодовое тело или мицелий» снят совсем. В памяти
# проекта записано замечание владельца: сторис про плодовое тело рядом с
# товаром «Міцелій їжовика» — прямое противоречие, и мицелий из-за этого
# уже убирали из товарных кадров. У нас 6 позиций мицелия в наличии, и
# кадр с выводом «бери плодовые тела» топит собственный товар.
# Вместо него — кадр про то, как гриб растёт: та же работа на доверие,
# но без стрельбы себе в ногу.
#
# ЛЮДИ ВЕРНУЛИСЬ. Первые два кадра предметные, вторые два живые. Владелец
# браковал конкретные руки — грязь и кривые ракурсы, — а не человека как
# такового.

