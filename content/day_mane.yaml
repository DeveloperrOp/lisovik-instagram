# День ежовика. СУТЬ ПЕРЕСОБРАНА.
#
# Ярик: «мне вообще не нравятся тексты, а может вообще суть того что ты
# пишешь». Он прав, и вот две ошибки, которые я делал.
#
# ОШИБКА ПЕРВАЯ. Я взял возражения из отзывов и построил на них ВЕСЬ
# день: дорого, муторно заваривать, выглядит неаппетитно. Получилась
# антиреклама — бренд четыре кадра подряд рассказывает, чем плох его
# собственный товар. Возражение работает как заход, когда оно одно из
# четырёх, а не когда оно все четыре.
#
# ОШИБКА ВТОРАЯ, ГЛАВНАЯ. Ни один кадр не говорил, ЗАЧЕМ это пить. Весь
# день был про логистику употребления — температура воды, осадок, гуща.
# Это контент для того, кто УЖЕ купил. А аккаунт продаёт тем, кто ещё
# нет. Я туда съехал, потому что боялся говорить про эффект.
#
# А граница у владельца давно проведена, на его же карточках:
#   «ноотроп від природи — допомагає зосередитися, краще памʼятати
#    й не вигоряти»
#   «натуральний помічник для розуму та сил»
# Формулировки ниже держатся этой границы и не идут дальше неё.
#
# НОВАЯ СУТЬ ДНЯ: что изменится в твоём дне → узнаёшь ли ты себя →
# когда это заметишь → как начать. Товар в конце каждого кадра.

