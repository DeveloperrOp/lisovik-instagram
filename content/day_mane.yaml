# Один день целиком: ежовик гребенчатый, четыре кадра.
#
# День — не четыре случайных факта об одном грибе, а порядок, в котором
# человек принимает решение:
#
#   1. чем этот гриб отличается от гриба из супа   → зачем он вообще
#   2. плодовое тело или мицелий                   → что именно брать
#   3. заварил и выбросил гущу                     → как не потерять товар
#   4. а какой на вкус                             → снять последний страх
#
# Факты отобраны по правилу «без оговорки»: химия и ботаника, а не
# клинические работы. У химии нет плацебо-группы, поэтому кадру не нужно
# спорить с самим собой.
#
# Формы сверены с catalog_raw.json: у нас в наличии и молотые плодовые
# тела, и зерномицелий НА БУРОМ РИСЕ. Поэтому второй кадр не говорит
# «бери плодовое тело, мицелий хуже» — он даёт человеку выбрать, и вывод
# ведёт к товару, который реально стоит на складе.
#
# Визуальный язык у каждого кадра свой, и предмет описан отдельно: четыре
# одинаковых белых гриба подряд читаются как один кадр.

thoughts:
- key: mane-what-inside
  topic: Їжовик гребінчастий
  day: mon
  layout: title_sub
  extra: ''
  look: macro-texture
  subject: >
    lion's mane mushroom: a white cascading cluster of soft hanging spines,
    dense and coral-like, and pale cream powder ground from it
  compound: гериценони
  source: гериценони плодового тіла Hericium erinaceus
  claim: «Гриби як гриби — чим цей інший?»
  why: >-
    Печерицю ти береш заради смаку. У мʼякоті цього гриба сидить окрема
    група сполук, їх звуть гериценонами, і в печериці їх немає. Заради них
    його й беруть.
  do: Почни з меленого — це вся мʼякоть гриба

- key: mane-body-vs-mycelium
  topic: Їжовик гребінчастий
  day: mon
  layout: versus
  extra: 'Плодове тіло: гериценони|Міцелій на рисі: еринацини'
  look: knolling
  subject: >
    two neat piles side by side on a plain surface: a white lion's mane
    fruiting body with hanging spines, and grains of brown rice overgrown
    with white mycelium
  compound: еринацини
  source: хімія плодових тіл проти культивованого зерноміцелію
  claim: «Плодове тіло чи міцелій — є різниця?»
  why: >-
    Різниця в самих речовинах. Мʼякоть гриба дає одну групу сполук, міцелій
    на рисі — зовсім іншу, її звуть еринацинами. Це два різні набори, а не
    більше й менше того самого.
  do: Хочеш сам гриб — бери мелені плодові тіла

- key: mane-keep-the-grounds
  topic: Їжовик гребінчастий
  day: mon
  layout: card
  extra: ''
  look: splash
  subject: >
    a cup of pale cream mushroom infusion with fine sediment settling at the
    bottom, a spoon of the same powder beside it
  compound: бета-глюкан
  source: водорозчинні полісахариди проти жиророзчинних сполук мʼякоті
  claim: «Заварив — і викинув гущу?»
  why: >-
    Гаряча вода забирає з порошку довгі цукрові ланцюги, найвідоміший з них
    зветься бета-глюканом. А смолисті сполуки мʼякоті осідають на дно —
    вода бере їх слабко.
  do: Розмішай і випий разом з осадом

- key: mane-taste
  topic: Їжовик гребінчастий
  day: mon
  layout: card
  extra: ''
  look: cgi-glossy
  subject: >
    pale cream mushroom powder being stirred into a glass of warm milk,
    soft swirl in the liquid, calm pastel setting
  compound: ''
  source: кулінарний профіль Hericium erinaceus
  claim: «А смак? Це ж гриб»
  why: >-
    Мʼякий, з горіховою ноткою — у кухні цим грибом замінюють морепродукти.
    У помелі лишається легка солодкувата основа, а гіркоти немає зовсім.
  do: Розмішай ложку в теплому молоці або какао
