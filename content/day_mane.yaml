# День ежовика, собранный из РЕАЛЬНЫХ возражений покупателей.
#
# ПОЧЕМУ ПЕРЕПИСАНО В ТРЕТИЙ РАЗ. Ярик: «главная претензия по прошлым
# работам к текстам, а не к картинкам». Он прав, и диагноз нашёлся не в
# моей голове, а в content/voice_lines.md — 167 строк живого языка, из
# них 60 objection и 36 drop.
#
# Доминирующая боль звучит так: «Пропил 2 курса, никаких изменений. Что
# пил, что не пил». Двадцать строк про то же самое. Человек не знает,
# чего ждать и когда — поэтому бросает и решает, что не работает.
#
# Второй по частоте страх: «Сподіваюсь це не пресована макуха!» — в банке
# не гриб, а наполнитель.
#
# А я писал «ні шапки, ні ніжки» и «смолисті сполуки в осаді». Ботаника
# вместо ответа на то, что человека реально держит от покупки.
#
# Теперь каждый кадр берёт одно возражение из отзывов и СНИМАЕТ его.
# Не подтверждает, не обходит — снимает и ведёт к действию.
#
# Фото с сайта не используются: только генерация. Товар в кадре без
# читаемой этикетки — на мелком тексте модель врёт.

