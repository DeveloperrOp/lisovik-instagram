# Тиждень 11, день 1: Гінкго білоба, екстракт у капсулах. Подача «паперова картка».
# product: https://lisovik.com.ua/hinkho-biloba-ekstrakt-kapsuly-60-sht-po-06-h/
# Факти — дослідник 01.11, кожен із джерелом. «Опечатка Кемпфера» — спірна
# версія (Michel 2011 проти Nagata et al. 2015), тому «сперечаються досі».
# Хіросіму свідомо не беремо. Ціна — за банку на 60, як на фото.
