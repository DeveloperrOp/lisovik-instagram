thoughts:
- key: w9-tremela-dawn
  topic: Тремела
  day: fri
  slot: dawn
  layout: macro
  subject: >
    one fresh white tremella snow fungus — translucent and jelly-like, with
    wavy frilly lobes like a sea anemone or a piece of seaweed — glistening
    slightly on the paper.
  claim: Її описали з Бразилії, а не з Китаю
  why: 1856 року англійський міколог Майлз Берклі описав тремелу за зразком, який ботанік Річард Спрюс зібрав
    на Ріо-Негро. Гриб він порівняв із морською водоростю.
  do: 'Порівняй сама: водорость чи гриб?'
  source: Hooker's J. Bot. 8:277 (1856), NZOR; nmns.edu.tw Collection-E00477
- key: w9-tremela-morning
  topic: Тремела
  day: fri
  slot: morning
  layout: giant
  body: >
    The giant jar stands upright on the right side of the frame. A WOMAN of
    about sixty with short silver hair, in a light linen dress, stands next
    to it arranging a bouquet of white translucent tremella mushrooms in a
    small ceramic vase, as if they were flowers, a soft happy smile — a
    feeling of a calm morning.
  details: a few small pieces of white translucent tremella snow fungus, a few pale pink rose petals,
    a few small green leaves.
  claim: Тремела — від слова «тремтіти»
  why: Латинське tremere означає «тремтіти». Так рід назвали ще 1753 року — свіжий гриб драглистий, як желе.
  do: Знайди Tremella fuciformis у складі на сайті
  source: en.wikipedia Tremella (Rea 1922, British Basidiomycetaceae); Linnaeus Sp. Pl. 1753
- key: w9-tremela-noon
  topic: Тремела
  day: fri
  slot: noon
  layout: macro
  subject: >
    a few dried tremella fungi, pale cream-yellow, hard and crinkled like
    crumpled paper, lying on the paper.
  claim: Почали з пляшок, перейшли на пакети
  why: 1977 року в повіті Гутянь на півдні Китаю Яо Шусянь виростив тремелу в скляних пляшках. Наступного
    року Дай Вейхао замінив пляшки пакетами — і Гутянь став столицею тремели.
  do: Перешли тому, хто вирощує гриби вдома
  source: news.cn 2025-08-25 (Xinhua); regional.chinadaily.com.cn/fujian 2024-12-06
- key: w9-tremela-evening
  topic: Тремела
  day: fri
  slot: evening
  layout: macro
  subject: >
    a small white bowl of clear sweet soup with a soft translucent tremella
    fungus in it, with a few red jujube dates and a few dried longan fruits
    lying beside the bowl.
  claim: У Китаї тремелу кладуть у десерт
  why: Китайською вона іньер — «срібне вухо». У кантонській кухні її варять у солодкому супі з зизифусом
    і сушеним лонганом.
  do: Як би назвала її ти? Напиши в директ
  source: en.wikipedia Tremella fuciformis (Chang & Miles 2004, Mushrooms, p. 329)
