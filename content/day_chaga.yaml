# День чаги. Собран НЕ из головы, а из out/briefs/чага.json.
#
# Это проверка процесса: если день чаги выйдет похожим на день ежовика,
# значит процесс не работает и уникальность бралась из старания.
#
# Возражения у чаги свои, ежовику они не подходят вообще:
#   «Чага, нарост на дереве, паразит, и по таким ценам?!»
#   «Не указано какой температуры должна быть вода. Что значит тёплая?»
#   «Всем хороша, вот только заваривать замучаешься»
#   «Хочешь чай из ГРИБКА ПАРАЗИТА? Звучит не очень АППЕТИТНО»
#
# Самая ценная строка нашлась в [tried]: «You can reuse chaga multiple
# times. First steep an hour, second two hours, third four.» Один кусок
# заваривают несколько раз — это прямой ответ на «по таким ценам».
#
# Формы сверены с каталогом: в наличии целая, молотая и капсулы.

