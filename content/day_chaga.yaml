# День чаги. Пилот по той же механике, что и ежовик.
#
# ГЛАВНОЕ ОГРАНИЧЕНИЕ ЭТОЙ ТЕМЫ. У ежовика формулировки пользы взяты с
# карточки владельца — там они безопасные («допомагає зосередитися»).
# С карточкой чаги так НЕЛЬЗЯ: в ней стоят онкологические заявления
# («профілактика злоякісних пухлин», «ризик новоутворень знижується»).
# В Instagram это мгновенная блокировка, а по закону о добавках —
# прямое нарушение. Поэтому польза здесь взята не с карточки.
#
# Безопасный и при этом сильный угол: в чаге НЕТ КОФЕИНА. Это факт о
# самом грибе, не обещание эффекта, и он решает узнаваемую проблему —
# вечерний кофе, после которого не спится.
#
# Суть дня та же, что у ежовика: что изменится в твоём дне → узнаёшь ли
# себя → что увидишь сам → как пить.

