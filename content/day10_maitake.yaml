# Факти — дослідник 25.10, кожен із джерелом. 🚨 Не взято: онкологію й
# D-fraction; казку з «Кондзяку моногатарі», де лісоруби «зʼїли гриби й
# пустилися в танок» (читається як психоактивний гриб); «срібло по вазі» —
# легенда без документів (вона вже виходила раніше як факт). Не беремо
# позицію «Мікродозинг Майтаке». Ціна — за банку на 120, як на фото.
