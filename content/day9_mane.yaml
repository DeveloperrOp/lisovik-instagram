  claim: У Китаї це «мавпяча голова»
  why: Так перекладається хоутоугу. Китайці ставлять цей гриб серед восьми гірських делікатесів —
    поруч із ведмежою лапою.
  do: Порівняй сам — голова чи грива?
  source: stdaily.com 2024-08-26 (八大山珍, 猴头菇); en.wikipedia Hericium erinaceus
- key: w9-mane-evening
  topic: Їжовик гребінчастий
  day: tue
  slot: evening
  layout: macro
  subject: >
