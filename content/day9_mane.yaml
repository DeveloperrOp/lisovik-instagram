- key: w9-mane-dawn
  topic: Їжовик гребінчастий
  day: tue
  slot: dawn
  layout: macro
  subject: >
    one fresh wild lion's mane mushroom — a snow-white ball of soft hanging
    spines, about the size of a fist — lying on the paper beside two green
    oak leaves and a little green moss.
  claim: 2021-го його знайшли в Одесі
  why: Ботаніки Одеського університету імені Мечникова та Інституту ботаніки НАН України вперше знайшли
    дикий їжовик у степовій зоні країни. Знахідку описали в «Українському ботанічному журналі».
  do: Побачиш у лісі — сфотографуй і лиши рости
  source: 'Укр. ботан. журн. 78(5): 365–369, 2021 — ukrbotj.co.ua/archive/78/5/365'
- key: w9-mane-morning
  topic: Їжовик гребінчастий
  day: tue
  slot: morning
  layout: giant
  body: >
    The giant jar stands upright on the right side of the frame. A WOMAN of
    about forty-five with short hair streaked with grey, in a light linen
    shirt and linen trousers, sits on a tiny wooden chair at a tiny wooden
    desk at the foot of the jar, writing in an open notebook with a pencil,
    a calm focused face and a faint smile; a small cup of tea stands on the
    desk. Beside the desk lies a white shaggy lion's mane mushroom as big as
    the desk — a feeling of a clear quiet morning.
  details: a few small pieces of white shaggy lion's mane mushroom, a few green oak leaves, a little
    green moss.
  claim: Їжак — і латиною, і по-нашому
  why: 1781 року француз Булльяр дав грибу видову назву erinaceus — «їжак». В українському «їжовику»
    той самий образ — білі мʼякі голки, що звисають донизу.
  do: Знайди erinaceus у складі на сайті
  source: Bulliard, Herbier de la France, pl. 34 (1781) — Hydnum erinaceus; colfungi.org, mycopedia.ch
- key: w9-mane-noon
  topic: Їжовик гребінчастий
  day: tue
  slot: noon
  layout: macro
  subject: >
    one large fresh lion's mane mushroom seen close from above, round like a
    fluffy white head, its soft white spines lit by gentle daylight, the
