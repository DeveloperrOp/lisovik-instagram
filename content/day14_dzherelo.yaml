thoughts:
- key: w14-dzherelo-dawn
  topic: Чай «Джерело сил»
  slot: dawn
  layout: specimen
  subject: In the middle of the fair stands a small rose bush covered with frost and snow, with bright
    red rose hips glittering with ice crystals.
  crew: 'Four tiny people: a woman picking a frosted rose hip into a wicker basket, a man scraping frost
    off a branch with a tiny spatula, a boy shaking snow off a branch onto his friend, a girl sliding
    on an icy path.'
  claim: Шипшина солодшає після морозу
  why: Мʼясиста червона частина шипшини — розросла основа квітки, а справжні плоди — дрібні горішки всередині.
    Після першого морозу мʼякоть стає мʼякшою й солодшою, тому збирати її не поспішають.
  source: en.wikipedia Rose hip
- key: w14-dzherelo-morning
  topic: Чай «Джерело сил»
  slot: morning
  layout: jar
  subject: The product stands in front of the stalls; a small bowl of red raspberries lies beside it.
    The scene is the winter FAIR with wooden stalls; the product is a SMALL tea box, no taller than one
    quarter of the frame. No mushrooms anywhere.
  crew: 'Four tiny people: a man counting raspberries out loud on his fingers, a woman stringing raspberries
    like beads on a thread, a child carrying one raspberry with both arms, a man weighing raspberries
    on tiny brass scales.'
  claim: Одна малинка — сотня намистин
  why: Ягода малини — не один плід, а близько сотні дрібних соковитих «намистин», кожна зі своїм зернятком.
    Усі вони виростають з однієї квітки.
  source: en.wikipedia Raspberry
- key: w14-dzherelo-noon
  topic: Чай «Джерело сил»
  slot: noon
  layout: specimen
  subject: In the middle of the fair lies a bunch of bright orange calendula flowers next to a large old
    paper wall calendar with blank pages and no printed numbers.
  crew: 'Five tiny people: a man flipping a huge blank calendar page, a woman arranging orange calendula
    flowers in a vase, a boy wearing a calendula flower as a hat, an old woman pointing at the calendar
    with her cane, a girl making a flower wreath.'
  claim: Календула названа на честь календаря
  why: 'Латинське Calendula походить від calendae — так у Давньому Римі звали перший день місяця. Одне
    з пояснень: вона цвіте майже щомісяця. Але це лише версія.'
  source: merriam-webster calendula; ahpa.org herbs_in_history_calendula
- key: w14-dzherelo-evening
  topic: Чай «Джерело сил»
  slot: evening
  layout: specimen
  subject: In the middle of the fair lies a bunch of bright blue cornflowers next to a small loaf of rye
