- key: w14-mane-noon
  topic: Їжовик гребінчастий
  slot: noon
  layout: specimen
  subject: In the middle of the fair lies a small stack of short beech logs, a few of them with small
    white lion's mane mushrooms appearing on their sides.
  crew: 'Five tiny people: a farmer drilling a small hole in a log with a hand drill, a woman hammering
    a wooden plug into a hole, a man carrying a log on his back, a girl painting a log end with a brush,
    a boy sitting on top of the stack with a hot drink.'
  claim: Урожай, якого чекають роками
  why: Колоди бука складають стосом і заражають грибницею. Перші їжовики зʼявляються за два роки, а найщедріше
    колода родить на третій-четвертий рік.
