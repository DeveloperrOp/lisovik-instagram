# Тиждень 9, день 7: Рейші, екстракт 10:1 у капсулах. Вайб «шалфей».
# product: https://lisovik.com.ua/reishi-trutovyk-lakovanyi-ekstrakt-101-kapsuly-120-sht-po-0.4-h/
# Факти — дослідник 19.10, кожен із джерелом. Не беремо: історію з Мао;
# «мантентаке — гриб десяти тисяч років» (читається як обіцянка
# довголіття); дослідження 2018 про ДНК «lucidum» (бʼє по нашій етикетці).
# «Капелюшок, ніби під лаком» уже виходив — тут лише як підказка до фото.
# Банка рейші — непрозора біла пляшечка, не прозора банка серії.
