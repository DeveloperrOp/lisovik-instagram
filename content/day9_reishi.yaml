  claim: «Блискуча шкіра» — так грецькою Ganoderma
  why: Рід 1881 року заснував фінський міколог Петер Адольф Карстен і зробив рейші його головним видом. Ganos
    — «блиск», derma — «шкіра».
  do: Глянь на шапку — блищить, наче під лаком
  source: Karsten, Revue Mycologique 3(9):16–19 (1881); en.wikipedia Ganoderma lucidum, Lingzhi mushroom
