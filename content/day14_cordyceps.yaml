thoughts:
- key: w14-cordyceps-dawn
  topic: Кордицепс військовий
  slot: dawn
  layout: specimen
  subject: In the middle of the fair, on a small wooden stand, stand a few bright orange club-shaped cordyceps
    fruiting bodies next to a small old wooden medieval mace with a round head, and a big open old dictionary
    book with blank pages.
  crew: 'Five tiny people: a knight in a toy helmet comparing the wooden mace with an orange club, a teacher
    pointing at the open dictionary, a girl writing in the air with her finger, a boy trying to lift the
    wooden mace, a woman laughing with a hot cup in her hands.'
  claim: Кордицепс — це «голова-булава»
  why: 'Назву склали з двох слів: грецьке «кордиле» означає булаву, а латинське «-цепс» — голову. Виходить
    «булавоголовий» — і справді, кожен гриб схожий на маленьку помаранчеву булаву.'
  source: 'en.wikipedia Cordyceps (etymology: kordylē + -ceps)'
- key: w14-cordyceps-morning
  topic: Кордицепс військовий
  slot: morning
  layout: jar
  subject: The product stands in front of the stalls, about one quarter of the frame height, fully visible
    with empty space on both sides; beside it stand three small clear glass jars with white rice at the
    bottom and small bright orange cordyceps clubs growing up from the rice.
  crew: 'Five tiny people: a farmer in a knitted vest lifting the lid of one glass jar, a girl counting
    the orange clubs through the glass, a man carrying a sack of rice on his shoulder, a woman wiping
    a jar with a cloth, a boy pressing his ear to a jar as if listening.'
  claim: Город у банці з рисом
  why: Цей кордицепс вирощують у скляних банках чи лотках, найчастіше на рисі. Перші тиждень-два він росте
    в темряві й теплі, а потім його «будять» світлом — і з рису підіймаються помаранчеві булави.
  source: PMC12523487 (Foods 2025, culture conditions of Cordyceps militaris)
- key: w14-cordyceps-noon
  topic: Кордицепс військовий
  slot: noon
  layout: specimen
  subject: In the middle of the fair stand a few bright orange club-shaped cordyceps fruiting bodies,
    their rough surface dotted with tiny bumps, like little orange maces.
  crew: 'Five tiny people: a girl holding a big magnifying glass to the bumpy orange surface, a man tapping
    one club with a tiny hammer like a doctor, a woman hugging one orange club, a boy climbing one club
    with a rope, a man taking a photo with an old camera.'
  claim: Що ховається в помаранчевій булаві
  why: Помаранчева булава заввишки 1–8 сантиметрів — щільна тканина гриба, яку звуть стромою. У її поверхні
    сховані мікроскопічні кишеньки, де дозрівають спори. Тому вона й шорстка, в цятках.
  source: en.wikipedia Cordyceps militaris
- key: w14-cordyceps-evening
  topic: Кордицепс військовий
  slot: evening
  layout: specimen
  subject: In the middle of the fair stands a small old 1950s chemistry laboratory table with glass flasks,
    a small brass microscope and a stack of old journals with plain covers, a few orange cordyceps clubs
    in a glass dish.
  crew: 'Four tiny people: a scientist in a 1950s white coat and round glasses looking into the microscope,
    a woman typing on a tiny old typewriter, a man holding a glass flask up to the light, a young assistant
    stacking the journals.'
  claim: '1950 рік: перше відкриття в цьому грибі'
  why: Саме з кордицепса військового 1950 року вчені вперше виділили нову речовину. На честь гриба її
    так і звуть — кордицепін.
  source: 'PMC8510467 (Molecules 2021): first isolated from C. militaris and characterised in 1950'
